  oring_gland_fill_frac: 0.75 # [ESTIMADO: llenado de ranura ≤ 85 %]

# -----------------------------------------------------------------------------
# MONTAJE / BASCULACIÓN (kick-up)
# -----------------------------------------------------------------------------
mount:
  clamp_screw_d_mm: 12        # [SUPUESTO: tornillo de abrazadera M12 A4 con mango en T]
  clamp_screws: 2             # [SUPUESTO]
  clamp_screw_torque_nm: 2.5  # [CALCULADO: máximo para FS ≥ 3 a creep en la C impresa (≈1 kN por tornillo, K=0.2); re-apretar antes de cada salida]
  clamp_screw_z_mm: -35.0     # [SUPUESTO: tornillos altos → menor momento en el puente de la C]
  clamp_leg_t_mm: 30.0        # [CALCULADO: FS ≥ 3 a creep con el apriete de diseño (structural.py)]
  clamp_width_mm: 150         # [SUPUESTO: ancho de la abrazadera a lo largo del espejo]
  swivel_pin_d_mm: 16         # [SUPUESTO: perno de dirección (torneado 316)]
  tilt_pin_d_mm: 12           # [SUPUESTO: eje de basculación (perno A4 M12 / torneado)]
  detent_release_moment_nm: 15.0   # [SUPUESTO: retén de bola; ver cálculo de kick-up]
  detent_notch_flank_deg: 40.0     # [SUPUESTO: ángulo de flanco de la muesca]
  detent_radius_mm: 55.0           # [SUPUESTO: radio del sector de retén]
  friction_coeff_detent: 0.15      # [ESTIMADO: bola inox sobre PETG/inox húmedo]
  impact_speed_m_s: 2.5            # [SUPUESTO: impacto a ~9 km/h]
  impact_contact_time_s: 0.010     # [ESTIMADO: contacto blando (arena/madera/patín impreso)]
  impact_peak_factor: 2.0          # [ESTIMADO: pico / medio de pulso semiseno ≈ π/2 → 2]
  handling_load_n: 200.0           # [SUPUESTO: en el puño de la caña: 1.6× la fuerza para levantar la cola (~120 N) y ≈2× izar la unidad por la caña]
  wave_slam_g: 3.0                 # [ESTIMADO: aceleración vertical en ola corta, bote chico]
  safety_lanyard_breaking_n: 3000  # [SUPUESTO: cabo de 6 mm + mosquetón inox]

