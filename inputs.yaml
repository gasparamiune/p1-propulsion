# LISTA DE MATERIALES (bom.py → bom.csv, resultados/bom_resumen.json, figuras/costo_autonomia.png)
# Precios del 2026-10-01. [VERIFICADO: research/Rxx §n] solo si el precio está en research/;
# el resto [ESTIMADO: base] con "buscar: …". DKK/USD se convierten con meta.
# spec "auto:*" = lo arma bom.py desde sizing.json / manifest.json / inputs (ver resolve()).
# ship: eu (+costs.shipping_frac) · incl (envío incluido) · local (retiro/taller local, sin envío)
#       cn (precio YA con IVA de importación en inputs; se suma costs.cn_shipping_eur por proveedor + su IVA)
# scope: sistema (total) · operacion (equipo de seguridad, aparte) · casco (lo hace Jorge, aparte)
# covers: piezas del manifest que el ítem compra/fabrica (bom.py verifica que toda pieza
#         "comprada" esté cubierta y que toda pieza que no sale del torno propio tenga servicio).
# rating: {a, v, role}: role power → se compara con sizing electrical.I_bat_peak_A y battery v_max;
#         control → solo tensión. Si no cumple, bom.py lo marca "⚠ NO CUMPLE" en la especificación.
# -----------------------------------------------------------------------------
