# -----------------------------------------------------------------------------
architecture_matrix:
  criteria:
    seguridad:     {w: 0.18, desc: "Seguridad: sin hélice expuesta para el piloto en el agua, golpes, parada"}
    concepto:      {w: 0.12, desc: "Cumple el concepto de Jorge (jet inboard, sin nada colgando del espejo)"}
    prestaciones:  {w: 0.14, desc: "Planeo y ~30 km/h con ~5 kW continuos (A y B: 3 — cruzan la joroba con margen < 10 %, 02 §3.2)"}
    eficiencia_5kn: {w: 0.08, desc: "Consumo a 5 kn (uso real dentro de 300 m)"}
    poca_prof:     {w: 0.08, desc: "Aguas someras, arena, algas"}
    viabilidad:    {w: 0.10, desc: "Fabricable con torno manual + Ender-3 + servicios comprables"}
    costo:         {w: 0.10, desc: "Costo total de la propulsión"}
    tiempo:        {w: 0.07, desc: "Tiempo hasta un prototipo probado"}
    reparabilidad: {w: 0.06, desc: "Repuestos y reparación local"}
    riesgo:        {w: 0.07, desc: "Riesgo técnico (cosas sin validar que pueden no funcionar)"}
  options:
    A:  {name: "Waterjet propio (impulsor CNC + bomba Al + toma soldada) — este diseño", scores: {seguridad: 4, concepto: 5, prestaciones: 3, eficiencia_5kn: 2, poca_prof: 3, viabilidad: 2, costo: 3, tiempo: 2, reparabilidad: 3, riesgo: 2}}
    B:  {name: "Waterjet comercial AWT JT132 (Ø130) + el tren eléctrico de este diseño", scores: {seguridad: 4, concepto: 5, prestaciones: 3, eficiencia_5kn: 2, poca_prof: 3, viabilidad: 4, costo: 4, tiempo: 4, reparabilidad: 3, riesgo: 3}}
    C:  {name: "Bomba de jet ski usada (Sea-Doo Spark 140) adaptada", scores: {seguridad: 4, concepto: 5, prestaciones: 3, eficiencia_5kn: 2, poca_prof: 3, viabilidad: 3, costo: 4, tiempo: 3, reparabilidad: 4, riesgo: 3}}
    D:  {name: "Fueraborda eléctrico de 3–6 kW con hélice", scores: {seguridad: 2, concepto: 1, prestaciones: 4, eficiencia_5kn: 4, poca_prof: 2, viabilidad: 5, costo: 2, tiempo: 5, reparabilidad: 2, riesgo: 5}}
    E:  {name: "Cola larga / surface drive (diseño P1 anterior, adaptado)", scores: {seguridad: 3, concepto: 1, prestaciones: 2, eficiencia_5kn: 4, poca_prof: 5, viabilidad: 4, costo: 4, tiempo: 3, reparabilidad: 5, riesgo: 3}}
    F:  {name: "Hélice entubada en túnel bajo el casco (pump-jet / rim-drive)", scores: {seguridad: 4, concepto: 3, prestaciones: 3, eficiencia_5kn: 3, poca_prof: 2, viabilidad: 2, costo: 3, tiempo: 2, reparabilidad: 2, riesgo: 2}}
  weight_perturbation: 0.5   # [SUPUESTO: ±50 % por criterio en el análisis de sensibilidad]
  monte_carlo_n: 20000       # [SUPUESTO: muestras de pesos aleatorios (Dirichlet α=1·w·20)]

