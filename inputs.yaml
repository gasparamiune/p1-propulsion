# MONTAJE / BASCULACIÓN (kick-up)
# -----------------------------------------------------------------------------
mount:
  clamp_screw_d_mm: 12        # [SUPUESTO: tornillo de abrazadera M12 A4 con mango en T]
  clamp_screws: 2             # [SUPUESTO]
  clamp_screw_torque_nm: 2.5  # [CALCULADO: máximo para FS ≥ 3 a creep en la C impresa (≈1 kN por tornillo, K=0.2); re-apretar antes de cada salida]
  clamp_screw_z_mm: -30.0     # [SUPUESTO: tornillos altos → menor momento en el puente de la C]
  clamp_leg_t_mm: 34.0        # [CALCULADO: FS ≥ 3 a creep (f_creep 0,35, research/R05) con el apriete de diseño (structural.py)]
