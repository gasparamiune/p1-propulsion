  import_duty_frac: 0.017      # [ESTIMADO: arancel UE partes de propulsión marina ~1,7 %; verificar código TARIC 8412/8487]
  import_basis: "CIF"          # [VERIFICADO: régimen aduanero UE — arancel sobre el valor CIF (precio + flete hasta la frontera UE) e IVA sobre CIF + arancel]; criterio ÚNICO para A (motor/ESC: inputs motor/esc duty_frac) y B (JT132)
