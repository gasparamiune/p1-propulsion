# =============================================================================
# inputs.yaml — ÚNICA FUENTE DE ENTRADAS del proyecto P1
# Todo el proyecto (cálculos, CAD, verificación, BOM, documentos) se regenera
# desde este archivo con:  python run_all.py
#
# Etiquetas (en el comentario de cada valor numérico):
#   [VERIFICADO: fuente]  dato leído en una fuente abierta en esta sesión
#   [CALCULADO]           resultado de un cálculo documentado
#   [ESTIMADO: base]      inferencia de ingeniería con base explícita
#   [SUPUESTO]            decisión de diseño / supuesto conservador
# Unidades SI salvo indicación; geometría en mm.
# Las decisiones y "qué cambia si el dato real difiere" están en decisiones.md
# =============================================================================

meta:
  project: "P1 propulsión eléctrica long-tail para jon boat de aluminio"
  version: "1.0"
  date: "2026-10-01"
  currency: "EUR"
  eur_to_dkk: 7.46            # [ESTIMADO: tipo fijo DKK/EUR (ERM II, central 7.46038)]

# -----------------------------------------------------------------------------
# EMBARCACIÓN (jon boat de aluminio < 2,5 m). Valores de diseño + rango.
# -----------------------------------------------------------------------------
boat:
  loa_m: 2.44                 # [ESTIMADO: jon boat 8 ft = 2.44 m; rango 2.1–2.5]
  lwl_m: 2.00                 # [ESTIMADO: LOA − proa lanzada ~0.4 m; menor LWL = Fr mayor = conservador]
  beam_m: 1.20                # [ESTIMADO: manga típica 8 ft jon 1.1–1.25 m]
  chine_beam_m: 0.95          # [ESTIMADO: ancho de fondo típico 0.8–1.0 m]
  transom_beam_m: 0.90        # [ESTIMADO: ancho de fondo 0.75–1.05 (research/R04 §A.4)]
  side_height_m: 0.38         # [ESTIMADO: puntal típico 8 ft jon 0.33–0.40 m]
  hull_mass_kg: 45.0          # [ESTIMADO: research/R04 §A.4 rango 22–45 kg (típico 32); se toma el alto (conservador para R)]
  block_coeff: 0.72           # [ESTIMADO: caja con proa lanzada, Cb 0.65–0.80]
  waterplane_coeff: 0.85      # [ESTIMADO: fondo plano con proa lanzada]
  max_capacity_kg: 160.0      # [ESTIMADO: regla USCG 33 CFR 183.35 sobre caja 2.44×1.2×0.38 ≈ 160 kg; rango 100–185 (research/R04 §A.4); LEER placa real]
  max_transom_hang_kg: 18.0   # [VERIFICADO: research/R04 — motor ≤ 18.2 kg (SeaExplorer 310), 28–35 kg en otros; se toma el menor]
  transom:
    height_mm: 381            # [ESTIMADO: espejo "short shaft" 15 in = 381 mm]
    height_range_mm: [330, 430]   # [ESTIMADO: rango de diseño]
    thickness_mm: 40          # [ESTIMADO: chapa Al ~2 mm + refuerzo de madera ~38 mm]
    thickness_range_mm: [20, 65]  # [VERIFICADO: research/R04 — abrazadera ePropulsion 28–63 mm; chapa desnuda 1.2 mm requiere taco ≥ 25 mm]
    rake_deg: 0.0             # [SUPUESTO: espejo vertical; la mayoría de jon boats 0–14°]
    top_width_mm: 900         # [ESTIMADO: ancho útil del borde superior del espejo]

# -----------------------------------------------------------------------------
# CARGA
# -----------------------------------------------------------------------------
load:
  n_persons: 2                # [VERIFICADO: requisito del usuario]
  mass_per_person_kg: 100.0   # [SUPUESTO: conservador, incluye ropa y chaleco]
  safety_gear_kg: 12.0        # [ESTIMADO: remos 2 kg, ancla+cabo 4 kg, achicador, botiquín, bolso estanco]
  misc_kg: 5.0                # [SUPUESTO: margen]

# -----------------------------------------------------------------------------
# AGUA Y AIRE (Als Fjord, Báltico occidental — agua salobre)
# -----------------------------------------------------------------------------
water:
  salinity_psu: 18.0          # [ESTIMADO: Báltico occidental superficial 10–22 PSU; ver research/R07]
  density_kg_m3: 1013.0       # [CALCULADO: ~1000 + 0.75·S a 10 °C]
  kinematic_viscosity_m2_s: 1.35e-6   # [ESTIMADO: agua salobre ~10 °C (dulce 10 °C: 1.31e-6)]
  temp_min_c: 2.0             # [ESTIMADO: invierno; ver research/R07]
  temp_max_c: 20.0            # [ESTIMADO: agosto]
  vapor_pressure_pa: 2340.0   # [ESTIMADO: presión de vapor a 20 °C (caso peor para cavitación)]
  p_atm_pa: 101325.0          # [VERIFICADO: atmósfera estándar]
air:
  density_kg_m3: 1.225        # [VERIFICADO: atmósfera estándar ISA]
  temp_max_c: 30.0            # [SUPUESTO: día de verano con sol]

# -----------------------------------------------------------------------------
# OPERACIÓN
# -----------------------------------------------------------------------------
operation:
  cruise_speed_kmh: 6.0       # [VERIFICADO: requisito del usuario; se verifica vs velocidad de casco]
  cruise_time_h: 2.0          # [VERIFICADO: requisito del usuario]
  reserve_frac: 0.20          # [VERIFICADO: requisito del usuario]
  max_speed_range_kmh: [8.0, 12.0]   # [VERIFICADO: requisito del usuario, "por ratos"]
  max_shore_distance_m: 300   # [VERIFICADO: requisito del usuario]
  design_headwind_m_s: 6.0    # [SUPUESTO: límite operativo de salida (≈ 4 Beaufort bajo)]
  design_current_m_s: 0.5     # [ESTIMADO: corriente de viento/estrecho ~1 kn; ver research/R07]
  wave_added_frac: 0.25       # [ESTIMADO: resistencia añadida en ola corta de fiordo +20–30 %]
  min_speed_over_ground_kmh: 3.0   # [SUPUESTO: avance mínimo contra viento+corriente de diseño]
  speed_sweep_kmh: [1.0, 14.0, 0.25]  # [SUPUESTO: barrido de cálculo min, max, paso]
  vmax_target_kmh: 8.0        # [SUPUESTO: mínimo de la franja 8–12 km/h, banda nominal, batería nominal]
  vmax_tolerance_kmh: 0.10    # [SUPUESTO: tolerancia numérica del criterio de V máx]
  max_prop_tip_depth_mm: 380   # [SUPUESTO: calado máximo de la punta de hélice bajo flotación en marcha (aguas someras)]

# -----------------------------------------------------------------------------
# MODELO DE RESISTENCIA (ver 02_calculos.md §2). Calibrable con remolque.
# R = R_F·(1+k) + R_TR + R_W + R_air ;  R_W = W·c_w·Fr⁴/(1+(Fr/Fr_h)⁴)
# -----------------------------------------------------------------------------
resistance:
  form_factor_k: 0.20         # [ESTIMADO: casco romo de fondo plano, 0.1–0.3]
  delta_cf: 0.0004            # [ESTIMADO: rugosidad de remaches/abolladuras de casco de aluminio]
  wave_cw: 1.50               # [ESTIMADO: calibrado para R/W≈0.045 a Fr_L≈0.37 (jon boat + trolling 55 lb); CALIBRAR con remolque]
  wave_fr_hump: 0.55          # [ESTIMADO: joroba de casco plano pesado Fr_L 0.5–0.7]
  air_cd: 1.0                 # [ESTIMADO: personas sentadas + borda, Cd 0.8–1.2]
  air_frontal_area_m2: 1.0    # [ESTIMADO: 2 personas sentadas (0.35 m²·2) + casco 0.3 m²]
  band_low: 0.75              # [ESTIMADO: borde inferior de la banda medida R(6 km/h)=95–150 N (research/R04 §C.3) / R nominal]
  band_high: 1.15             # [ESTIMADO: borde superior de la banda medida (150 N a 6 km/h, research/R04 §C.3); se usa para dimensionar]
  design_band: "high"         # [SUPUESTO: dimensionar con la banda alta]

# -----------------------------------------------------------------------------
# ARQUITECTURA Y GEOMETRÍA DE LA COLA LARGA (long-tail)
# -----------------------------------------------------------------------------
architecture:
  id: "A3-longtail"           # [SUPUESTO: ver 03_arquitectura.md]
  shaft_angle_deg: 25.0       # [SUPUESTO: 20–30°; pérdida axial 1−cos θ]
  pivot_height_above_transom_mm: 135  # [SUPUESTO: eje de basculación sobre el borde del espejo; despeje del plato giratorio y de la basculación]
  pivot_aft_of_transom_mm: 80         # [SUPUESTO: eje de basculación detrás de la cara exterior del espejo]
  shaft_line_offset_below_pivot_mm: 55  # [SUPUESTO: e; empuje avante "clava" la cola, ver §mecánica; deja 36 mm de pared entre perno y tubo]
  prop_tip_immersion_frac_D: 0.40     # [ESTIMADO: inmersión mínima de puntera para evitar ventilación]
  steer_range_deg: 35.0       # [SUPUESTO: ±35° de dirección]
  tilt_range_deg: 25.0        # [CALCULADO: la punta de hélice sale del agua con ~22° y queda ~110 mm sobre la flotación a 25° (02_calculos.md §8); verify confirma despeje]
  shaft_top_ahead_of_pivot_mm: 70     # [SUPUESTO: cara de popa de la placa motriz delante del pivote (u)]
  unit_mass_estimate_kg: 9.0          # [ESTIMADO: unidad completa; se contrasta con la masa del CAD en verify]

# -----------------------------------------------------------------------------
# HÉLICE (comprada, aluminio, fueraborda 2.5–3.5 hp, pasador de corte)
# -----------------------------------------------------------------------------
propeller:
  chosen: "auto"              # [SUPUESTO: "auto" = sizing elige la combinación de mínimo costo que cumple requisitos]
  options:
    OB78x6:
      desc: "Hélice aluminio 3 palas 7.8x6 in (fueraborda 2.5–3.5 hp)"
      D_mm: 198.0             # [ESTIMADO: 7.8 in]
      P_mm: 152.4             # [ESTIMADO: 6 in]
      Z: 3                    # [ESTIMADO: típico fueraborda chico]
      BAR: 0.45               # [ESTIMADO: AE/A0 típico fueraborda chico 0.40–0.55]
      hub_length_mm: 60       # [ESTIMADO: envolvente del cubo]
      hub_d_mm: 40            # [ESTIMADO]
      bore_mm: 12.0           # [ESTIMADO: a MEDIR en la hélice comprada; el eje se tornea a medida]
      mass_kg: 0.45           # [ESTIMADO]
      price_eur: 45.0         # [ESTIMADO: hélice aftermarket aluminio 7.8 in 35–60 €]
    OB74x55:
      desc: "Hélice aluminio 3 palas 7.4x5.5 in (fueraborda 2–2.5 hp)"
      D_mm: 188.0             # [ESTIMADO: 7.4 in]
      P_mm: 139.7             # [ESTIMADO: 5.5 in]
      Z: 3                    # [ESTIMADO]
      BAR: 0.45               # [ESTIMADO]
      hub_length_mm: 55       # [ESTIMADO]
      hub_d_mm: 38            # [ESTIMADO]
      bore_mm: 12.0           # [ESTIMADO]
      mass_kg: 0.40           # [ESTIMADO]
      price_eur: 40.0         # [ESTIMADO]
    EO10x8:
      desc: "Hélice aluminio/compuesto 3 palas 10x8 in, cubo con pasador (objetivo de compra, motor eléctrico ~1 kW)"
      D_mm: 254.0             # [SUPUESTO: objetivo de diseño; producto concreto en BOM]
      P_mm: 203.2             # [SUPUESTO: P/D 0.8]
      Z: 3                    # [SUPUESTO]
      BAR: 0.50               # [SUPUESTO]
      hub_length_mm: 60       # [ESTIMADO]
      hub_d_mm: 42            # [ESTIMADO]
      bore_mm: 16.0           # [SUPUESTO: elegir hélice con bore ≥ 16 mm o bujear; MEDIR la real]
      mass_kg: 0.55           # [ESTIMADO]
      price_eur: 60.0         # [ESTIMADO: hélice de repuesto de motor eléctrico chico 40–90 €]
    EO11x8:
      desc: "Hélice 3 palas 11x8 in, cubo con pasador (objetivo de compra)"
      D_mm: 279.4             # [SUPUESTO]
      P_mm: 203.2             # [SUPUESTO: P/D 0.73]
      Z: 3                    # [SUPUESTO]
      BAR: 0.50               # [SUPUESTO]
      hub_length_mm: 62       # [ESTIMADO]
      hub_d_mm: 44            # [ESTIMADO]
      bore_mm: 16.0           # [SUPUESTO]
      mass_kg: 0.65           # [ESTIMADO]
      price_eur: 75.0         # [ESTIMADO]
    WW10x4:
      desc: "Hélice compuesta 2 palas weedless 10x4 in (trolling motor)"
      D_mm: 254.0             # [ESTIMADO: 10 in]
      P_mm: 101.6             # [ESTIMADO: 4 in]
      Z: 2                    # [ESTIMADO]
      BAR: 0.35               # [ESTIMADO]
      hub_length_mm: 70       # [ESTIMADO]
      hub_d_mm: 45            # [ESTIMADO]
      bore_mm: 9.5            # [ESTIMADO]
      mass_kg: 0.25           # [ESTIMADO]
      price_eur: 35.0         # [ESTIMADO]
  wake_fraction: 0.02         # [ESTIMADO: hélice ~1 m detrás del espejo, flujo casi libre]
  thrust_deduction: 0.02      # [ESTIMADO: idem]
  eta_relative_rotative: 1.0  # [SUPUESTO]
  efficiency_factor: 1.0      # [SUPUESTO: multiplicador de η0 del modelo de hélice (calibración/sensibilidad)]
  guard:
    type: "ring"              # [SUPUESTO: aro protector impreso + patín]
    thrust_loss_frac: 0.06    # [ESTIMADO: aro corto no perfilado 3–8 % de empuje a velocidad]
    bollard_gain_frac: 0.00   # [SUPUESTO: un aro no perfilado no se acredita ganancia]
    radial_clearance_mm: 10.0 # [SUPUESTO: holgura puntera–aro]
  skeg_fuse_force_n: 300.0    # [CALCULADO: el patín rompe antes de que el tubo Al 40×3 baje de FS 2 con la cola trabada (04_diseno/structural.py)]
  shear_pin:
    target_factor_vs_qmax: 2.0     # [SUPUESTO: corta a 2× el torque máximo normal del eje]
    material: "Al6061-T6"     # [SUPUESTO: Al o latón; inox demasiado fuerte para el torque de P1]
    tau_ult_mpa: 207.0        # [ESTIMADO: Al 6061-T6 corte último ~207 MPa (MatWeb típico)]

# -----------------------------------------------------------------------------
# TRANSMISIÓN (correa HTD-5M arriba del agua) Y EJE
# -----------------------------------------------------------------------------
drivetrain:
  belt_type: "HTD-5M"         # [SUPUESTO]
  belt_width_mm: 15           # [SUPUESTO: verificar capacidad en §mecánica]
  z_motor_options: [14, 15, 16, 18, 20, 22, 24]          # [SUPUESTO: poleas HTD-5M de stock, bore 8 mm]
  z_shaft_options: [36, 40, 44, 48, 50, 56, 60, 64, 72]  # [SUPUESTO: poleas HTD-5M de stock]
  belt_pitch_mm: 5.0          # [VERIFICADO: HTD-5M = paso 5 mm (definición)]
  center_distance_mm: 125     # [SUPUESTO: ajustable ±8 mm por ranuras]
  eta_belt: 0.96              # [ESTIMADO: correa dentada 0.95–0.98]
  eta_bearings: 0.98          # [ESTIMADO: 2 rodamientos + 3 bujes en agua]
  belt_allow_tension_n: 400   # [ESTIMADO: HTD-5M 15 mm, tensión de trabajo admisible ~300–450 N; verificar catálogo]
shaft:
  material: "AISI 316"        # [SUPUESTO]
  d_mm: 16.0                  # [CALCULADO: Ø12 daba FS fatiga 1.1 y torsión en pasador 1.3 (ver decisiones D-07)]
  d_bearing_mm: 15.0          # [SUPUESTO: muñón torneado para rodamiento 6002]
  E_gpa: 193.0                # [ESTIMADO: 316 típico]
  sy_mpa: 205.0               # [ESTIMADO: 316 recocido, mínimo ASTM A276 ~205 MPa]
  su_mpa: 515.0               # [ESTIMADO: 316 recocido, mínimo ~515 MPa]
  se_mpa: 120.0               # [ESTIMADO: límite de fatiga corregido en agua salobre (corrosión-fatiga) ~0.25·Su]
  se_dry_mpa: 150.0           # [ESTIMADO: 0.45·Su (pulido) × 0.8 sup. × 0.9 tamaño × 0.9 confiab. ≈ 150 MPa; muñones secos]
  kf_shoulder: 1.6            # [ESTIMADO: asiento de polea con plano de prisionero (Kt≈1.6–2.0); conservador]
  density_kg_m3: 8000.0       # [ESTIMADO]
  n_bushings: 3               # [SUPUESTO: arriba(tubo), medio, abajo]
  tube_material: "Al 6061-T6 anodizado"   # [SUPUESTO: ver decisiones D-09 (tubo inox 25×1.5 no resiste el impacto)]
  tube_od_mm: 40.0            # [SUPUESTO: tubo Al 40×3]
  tube_wall_mm: 3.0           # [SUPUESTO]
  tube_density_kg_m3: 2700.0  # [ESTIMADO: aluminio]
  tube_sy_mpa: 240.0          # [ESTIMADO: 6061-T6 típico ≥ 240 MPa (EN 755-2 6061-T6 tubo ~240)]
  tube_E_gpa: 69.0            # [ESTIMADO: aluminio]
  bushing_material: "POM-C"   # [SUPUESTO: torneado de barra Ø35; alternativa igus iglide]
  bushing_length_mm: 40.0     # [SUPUESTO: L/d = 2.5 para buje lubricado por agua]
bearings:
  name: "6002-2RS inox (15×32×9)"   # [SUPUESTO: par de rodamientos, uno a cada lado de la polea conducida]
  d_mm: 15                    # [VERIFICADO: designación 6002 = 15×32×9 mm (ISO 15)]
  D_mm: 32                    # [VERIFICADO: idem]
  B_mm: 9                     # [VERIFICADO: idem]
  C_N: 5590.0                 # [ESTIMADO: 6002 acero al cromo, catálogo típico 5.59 kN]
  C0_N: 2850.0                # [ESTIMADO: 6002 acero al cromo 2.85 kN]
  stainless_factor: 0.80      # [ESTIMADO: AISI 440C ≈ 80 % de la capacidad del cromo]

# -----------------------------------------------------------------------------
# MOTOR / ESC (catálogo provisorio; precios y datos a refinar con research/R08a)
# Modelo DC: Kt = 60/(2π·KV) ; V = ω/KV_rad + I·R ; Q = Kt·(I − I0)
# -----------------------------------------------------------------------------
motor:
  chosen: "OR6374_190"        # [SUPUESTO: ver 02_calculos.md §5]
  options:
    OR6374_190:
      desc: "Outrunner 6374 190 KV (clase e-skate)"
      kv_rpm_v: 190.0         # [ESTIMADO: dato de catálogo típico]
      r_ohm: 0.030            # [ESTIMADO: fase-fase típica 6374 ~25–40 mΩ]
      i0_a: 1.5               # [ESTIMADO]
      i_max_a: 80.0           # [ESTIMADO: catálogo típico 6374]
      p_max_w: 3000.0         # [ESTIMADO]
      mass_kg: 0.95           # [ESTIMADO]
      d_mm: 63.0              # [VERIFICADO: designación 63xx = Ø63 mm]
      l_mm: 74.0              # [VERIFICADO: designación xx74 = 74 mm]
      shaft_d_mm: 8.0         # [ESTIMADO: típico 6374 eje 8 mm]
      shaft_protrusion_mm: 30.0   # [ESTIMADO: saliente del eje desde la cara de montaje; MEDIR]
      mount_bolt_circle_mm: 30.0  # [ESTIMADO: patrón 4×M4 en Ø30 típico; MEDIR]
      price_eur: 75.0         # [ESTIMADO]
      rth_k_w: 0.45           # [ESTIMADO: outrunner autoventilado con capó ventilado]
      tau_th_s: 600.0         # [ESTIMADO: constante térmica ~10 min]
      t_winding_max_c: 120.0  # [SUPUESTO: límite conservador de bobinado]
    OR6384_140:
      desc: "Outrunner 6384 140 KV"
      kv_rpm_v: 140.0         # [ESTIMADO]
      r_ohm: 0.040            # [ESTIMADO]
      i0_a: 1.3               # [ESTIMADO]
      i_max_a: 80.0           # [ESTIMADO]
      p_max_w: 3500.0         # [ESTIMADO]
      mass_kg: 1.15           # [ESTIMADO]
      d_mm: 63.0              # [VERIFICADO: designación]
      l_mm: 84.0              # [VERIFICADO: designación]
      shaft_d_mm: 8.0         # [ESTIMADO]
      shaft_protrusion_mm: 30.0   # [ESTIMADO]
      mount_bolt_circle_mm: 30.0  # [ESTIMADO]
      price_eur: 90.0         # [ESTIMADO]
      rth_k_w: 0.42           # [ESTIMADO]
      tau_th_s: 700.0         # [ESTIMADO]
      t_winding_max_c: 120.0  # [SUPUESTO]
  current_limit_a: 70.0       # [SUPUESTO: límite de corriente de fase configurado en el ESC]
  reverse_current_frac: 0.5   # [SUPUESTO: límite de marcha atrás por firmware]
esc:
  chosen: "VESC75100"         # [SUPUESTO]
  options:
    VESC75100:
      desc: "ESC tipo VESC 75 V / 100 A (bidireccional, FOC)"
      v_max: 75.0             # [ESTIMADO: designación 75100]
      i_cont_a: 100.0         # [ESTIMADO: designación; con disipador]
      eta: 0.97               # [ESTIMADO: FOC MOSFET a carga media]
      mass_kg: 0.25           # [ESTIMADO]
      price_eur: 110.0        # [ESTIMADO]
  margin_min_frac: 0.30       # [VERIFICADO: requisito del usuario ≥ 30 %]

# -----------------------------------------------------------------------------
# BATERÍA (catálogo provisorio; refinar con research/R08a)
# -----------------------------------------------------------------------------
battery:
  chemistry: "LiFePO4"        # [SUPUESTO: ver 02_calculos.md §6 y research/R06]
  chosen: "auto"              # [SUPUESTO: "auto" = mínimo costo que cumple energía, corriente y V máx objetivo]
  usable_dod: 0.90            # [ESTIMADO: BMS corta ~95 %, se reserva 5 % adicional]
  v_sag_frac_at_max: 0.06     # [ESTIMADO: caída bajo carga a 1C con SoC bajo]
  options:
    LFP24_50:
      desc: "LiFePO4 25.6 V 50 Ah con BMS 100 A"
      series_units: 1         # [SUPUESTO]
      v_nom: 25.6             # [VERIFICADO: 8S × 3.2 V]
      v_min: 22.0             # [ESTIMADO: 8S × 2.75 V bajo carga]
      ah: 50.0                # [ESTIMADO]
      i_cont_a: 100.0         # [ESTIMADO]
      mass_kg: 11.5           # [ESTIMADO]
      price_eur: 330.0        # [ESTIMADO]
    LFP24_100:
      desc: "LiFePO4 25.6 V 100 Ah con BMS 100 A"
      series_units: 1         # [SUPUESTO]
      v_nom: 25.6             # [VERIFICADO: 8S × 3.2 V]
      v_min: 22.0             # [ESTIMADO]
      ah: 100.0               # [ESTIMADO]
      i_cont_a: 100.0         # [ESTIMADO]
      mass_kg: 21.0           # [ESTIMADO]
      price_eur: 560.0        # [ESTIMADO]
    LFP12_100x2:
      desc: "2 × LiFePO4 12.8 V 100 Ah en serie (BMS 100 A c/u)"
      series_units: 2         # [SUPUESTO]
      v_nom: 25.6             # [VERIFICADO: 2 × 4S × 3.2 V]
      v_min: 22.0             # [ESTIMADO]
      ah: 100.0               # [ESTIMADO]
      i_cont_a: 100.0         # [ESTIMADO]
      mass_kg: 22.0           # [ESTIMADO: 2 × 11 kg]
      price_eur: 380.0        # [ESTIMADO: 2 × 190 €]
    LFP12_50x2:
      desc: "2 × LiFePO4 12.8 V 50 Ah en serie (BMS 50 A c/u)"
      series_units: 2         # [SUPUESTO]
