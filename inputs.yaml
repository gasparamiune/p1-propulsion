# -----------------------------------------------------------------------------
# CABLEADO Y PROTECCIONES
# -----------------------------------------------------------------------------
electrical:
  len_battery_to_esc_m: 1.5   # [SUPUESTO: un sentido, batería centrada atrás → caja ESC]
  len_esc_to_motor_m: 2.0     # [SUPUESTO: fases a la unidad basculante con bucle de servicio]
  rho_cu_ohm_m: 2.1e-8        # [ESTIMADO: cobre a ~70 °C]
  max_drop_frac: 0.03         # [VERIFICADO: requisito del usuario (< 3 %)]
  cable_sections_mm2: [4, 6, 10, 16, 25, 35]       # [SUPUESTO: secciones normalizadas]
  ampacity_a: [40, 55, 75, 100, 135, 170]          # [ESTIMADO: cable 105 °C fuera de sala de motores, conservador; verificar tabla ISO 13297/ABYC]
  fuse_ratings_a: [60, 80, 100, 125, 150]          # [SUPUESTO: valores ANL/MIDI normalizados]
  fuse_factor: 1.25           # [ESTIMADO: fusible ≥ 1.25 × I continua]
  kill_switch_response_s_max: 1.0   # [VERIFICADO: requisito del usuario (< 1 s)]
  max_nominal_voltage_v: 48.0       # [VERIFICADO: requisito del usuario (≤ 48 V salvo justificación)]

# -----------------------------------------------------------------------------
# MATERIALES (provisorio; refinar con research/R05)
# -----------------------------------------------------------------------------
materials:
  PETG:
    density_g_cm3: 1.27       # [ESTIMADO: TDS típicos PETG 1.27]
    sigma_t_xy_mpa: 45.0      # [ESTIMADO: probeta impresa XY, TDS típicos 40–50 MPa]
    sigma_t_z_mpa: 25.0       # [ESTIMADO: unión entre capas ~50–60 % de XY]
    E_mpa: 1900.0             # [ESTIMADO: TDS típicos 1.8–2.1 GPa]
    tg_c: 80.0                # [ESTIMADO: PETG Tg ~78–85 °C]
    t_service_max_c: 60.0     # [SUPUESTO: Tg − 20 K; límite de servicio de piezas impresas]
    price_eur_per_kg: 22.0    # [ESTIMADO: PETG 1 kg EU 18–28 €]
  ASA:
    density_g_cm3: 1.07       # [ESTIMADO]
    sigma_t_xy_mpa: 40.0      # [ESTIMADO]
    sigma_t_z_mpa: 22.0       # [ESTIMADO]
    E_mpa: 2000.0             # [ESTIMADO]
    tg_c: 100.0               # [ESTIMADO]
    t_service_max_c: 75.0     # [SUPUESTO]
    price_eur_per_kg: 26.0    # [ESTIMADO]
  design_factors:             # Factores de reducción FDM (multiplican la resistencia)
    f_water: 0.85             # [ESTIMADO: PETG saturado en agua pierde ~5–15 %]
    f_temp: 0.85              # [ESTIMADO: a 40 °C de servicio]
    f_process: 0.80           # [ESTIMADO: variabilidad de impresión, poros, costura]
    f_creep: 0.50             # [ESTIMADO: carga sostenida horas–días a ≤ 40 °C]
    f_fatigue: 0.30           # [ESTIMADO: 1e7–1e8 ciclos, termoplástico amorfo]
    f_z: 0.55                 # [ESTIMADO: cuando la carga cruza capas (evitar por diseño)]
  fs_target_printed: 3.0      # [VERIFICADO: requisito del usuario FS ≥ 3]
  fs_target_metal: 2.0        # [SUPUESTO: metales con propiedades certificadas]

