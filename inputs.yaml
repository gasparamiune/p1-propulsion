# =============================================================================
# inputs.yaml — ÚNICA FUENTE DE ENTRADAS del proyecto P1-J (waterjet de Jorge)
# Todo el proyecto (cálculos, CAD, verificación, BOM, documentos) se regenera
# desde este archivo con:  python run_all.py
#
# Etiquetas (en el comentario de cada valor numérico):
#   [VERIFICADO: fuente]  dato leído en una fuente abierta en esta sesión
#   [CALCULADO]           resultado de un cálculo documentado
#   [ESTIMADO: base]      inferencia de ingeniería con base explícita
#   [SUPUESTO]            decisión de diseño / supuesto conservador
# Unidades SI salvo indicación; geometría en mm en las claves *_mm.
# Las decisiones y "qué cambia si el dato real difiere" están en decisiones.md
# El diseño anterior (cola larga para jon boat, 2 personas, 6 km/h) quedó en el
# historial de git (commit 5dfada0) y en decisiones.md §Historia.
# =============================================================================

meta:
  project: "P1-J — waterjet eléctrico inboard para el jet boat de Jorge (2,30 m)"
  version: "2.0"
  date: "2026-10-01"
  currency: "EUR"
  eur_to_dkk: 7.4755          # [VERIFICADO: BCE 2026-09-30, research/R08a §0]
  usd_to_eur: 0.8807          # [VERIFICADO: BCE 2026-09-30 (1 EUR = 1,1355 USD), research/R08a §0]

# -----------------------------------------------------------------------------
# CASCO — jet boat de Jorge (plano preliminar 26/09/2026, referencias/). Las vistas
# del plano no comparten escala (R10b §4.1): todo [ESTIMADO] hasta medir (PENDIENTES P0).
# x = hacia proa desde la cara exterior del espejo; z = hacia arriba desde la quilla.
# -----------------------------------------------------------------------------
boat:
  loa_m: 2.30                 # [VERIFICADO: plano de Jorge, cota "2300 largo total casco"]
  beam_m: 0.80                # [VERIFICADO: plano de Jorge, cota "800 ancho total casco"]
  lwl_m: 1.75                 # [ESTIMADO: research/R10b §4.3 — largo de fondo 1,73 m medido a escala]
  bottom_beam_m: 0.42         # [ESTIMADO: research/R10b §4.3 — fondo leído en la vista trasera (variante 0,60)]
  chine_beam_m: 0.69          # [ESTIMADO: research/R10b §4.3 — manga en el pantoque]
  chine_height_m: 0.25        # [ESTIMADO: research/R10b §4.3]
  gunwale_height_m: 0.52      # [VERIFICADO: plano de Jorge, cota 520 (vista trasera)]
  transom_height_m: 0.42      # [VERIFICADO: plano de Jorge, cota 420 en el espejo]
  deadrise_deg: 8.0           # [ESTIMADO: research/R10b §4.4 usó 5–10°; medir]
  planing_beam_m: 0.60        # [ESTIMADO: research/R10b §4.4 — manga de planeo media (b de Savitsky)]
  block_coeff: 0.80           # [ESTIMADO: coeficiente longitudinal ∇ = C·L·A_sección; R10b usó C_wp 0,85]
  waterplane_inertia_coeff: 0.065   # [ESTIMADO: research/R10b §4.3 — forma de flotación supuesta (70 % rectángulo + 30 % proa triangular); el cálculo es exacto, la forma no está medida]
  hull_mass_kg: 38.0          # [ESTIMADO: research/R10b §4.2 — 30–45 kg con cubierta, consola y asiento] — ÚNICA fuente: la usan masses.items.hull y la capacidad (33 CFR 183)
  bottom_thickness_mm: 4.0    # [SUPUESTO: casco de aluminio 4 mm; medir (la placa de la toma se ajusta)]
  transom_thickness_mm: 6.0   # [SUPUESTO: medir]
  floor_height_m: 0.075       # [ESTIMADO: research/R10a §5.2 — piso dibujado a 71–79 mm del fondo]

# -----------------------------------------------------------------------------
# MASAS (1 piloto). kg "sel:<clave>" = lo pone el optimizador según la selección.
# -----------------------------------------------------------------------------
masses:
  items:
    hull:     {desc: "Casco con cubierta, consola y asiento", kg: "inp:boat.hull_mass_kg", x_m: 0.95, z_m: 0.22, tag: "[ESTIMADO: research/R10b §4.2, §4.4]"}
    pilot:    {desc: "Piloto", kg: 90.0, x_m: 1.38, z_m: 0.55, tag: "[SUPUESTO: 80–100 kg; posición del asiento del plano (R10b §4.4)]"}
    battery:  {desc: "Batería", kg: "sel:battery_kg", x_m: 1.28, z_m: 0.18, machinery: true, tag: "[CALCULADO: CAD P1-BAT-01 — 2 baterías lado a lado a proa del controlador, x 1,01–1,55 m]"}
    motor:    {desc: "Motor eléctrico", kg: "sel:motor_kg", x_m: 0.74, z_m: 0.16, machinery: true, tag: "[CALCULADO: 04_diseno/params.py motor_x_mid / motor_axis_z_mid con Ø132]"}
    jet:      {desc: "Unidad de waterjet (toma, bomba, tobera, dirección, bucket, tren)", kg: "sel:jet_kg", x_m: 0.25, z_m: 0.12, machinery: true, tag: "[CALCULADO: CAD (manifest) o ESTIMADO 12 kg antes del primer CAD]"}
    esc:      {desc: "Controlador, contactor, fusible, cables", kg: 6.0, x_m: 0.90, z_m: 0.30, machinery: true, tag: "[ESTIMADO: research/R10b §4.2 4–7 kg]"}
    water:    {desc: "Agua retenida en toma y bomba", kg: 4.0, x_m: 0.30, z_m: 0.10, tag: "[ESTIMADO: research/R10b §4.2 2–5 kg]"}
    gear:     {desc: "Equipo de seguridad (chaleco, remo, cabo, achicador)", kg: 6.0, x_m: 1.60, z_m: 0.25, tag: "[ESTIMADO: research/R10b §4.2 5–8 kg]"}
    foam:     {desc: "Flotación fija (espuma de celda cerrada) + bomba de achique", kg: 5.0, x_m: 1.20, z_m: 0.30, tag: "[ESTIMADO: ~100 L de espuma a 30 kg/m³ + bomba 1,5 kg (R10b H5)]"}
  jet_mass_estimate_kg: 12.0  # [ESTIMADO: research/R10b §4.2 — bomba 8–15 kg; se reemplaza por la masa del CAD]
  light_pilot_kg: 70.0        # [SUPUESTO: caso liviano para el tope legal de rpm]


water:
  salinity_psu: 18.0          # [VERIFICADO: research/R07 §2 — media mensual superficial 13,6–17,6 PSU (Copernicus BAL); 18 = conservador para densidad]
  salinity_corrosion_psu: 20.5   # [VERIFICADO: research/R07 §2 — p90 superficial; diseño de corrosión/aislamiento galvánico]
  density_kg_m3: 1013.0       # [CALCULADO: ~1000 + 0.75·S a 10 °C; research/R07 §2.5 EOS-80: 1010–1016]
  kinematic_viscosity_m2_s: 1.35e-6   # [ESTIMADO: agua salobre ~10 °C (dulce 10 °C: 1.31e-6)]
  temp_min_c: 2.0             # [VERIFICADO: research/R07 §3 — mínimo invernal; solo almacenamiento / frío del PETG]
  temp_operating_min_c: 12.0  # [VERIFICADO: research/R07 §3.4 — temporada 15 jun–15 sep: agua ≥ 12 °C ~100 % de los días jul–sep]
  temp_max_c: 24.0            # [VERIFICADO: research/R07 §3.1 — máx diario observado 23,3 °C (DMI Fynshav), instantáneo 26,4 °C]
  vapor_pressure_pa: 2984.0   # [ESTIMADO: ecuación de Buck a 24 °C (research/R07); caso peor para cavitación]
  p_atm_pa: 101325.0          # [VERIFICADO: atmósfera estándar]

air:
  density_kg_m3: 1.225        # [VERIFICADO: atmósfera estándar ISA]
  pressure_pa: 101325.0       # [VERIFICADO: atmósfera estándar ISA]
  temp_max_c: 30.0            # [SUPUESTO: día de verano con sol]

materials:
  PETG:
    density_g_cm3: 1.27       # [ESTIMADO: TDS típicos PETG 1.27]
    sigma_t_xy_mpa: 47.0      # [VERIFICADO: research/R05 S1 Prusament PETG TDS 47±2 MPa (PolyLite 50.8)]
    sigma_t_z_mpa: 18.0       # [VERIFICADO: research/R05 S1 "interlayer adhesion" 18±4 MPa]
    E_mpa: 1500.0             # [VERIFICADO: research/R05 S1 Prusament 1500 MPa (el menor de los TDS: conservador para deformación)]
    tg_c: 69.0                # [VERIFICADO: research/R05 S3 Bambu 69 °C (PolyLite 81); HDT 68 °C a 1,8 MPa]
    t_service_max_c: 50.0     # [ESTIMADO: research/R05 — HDT 65,7–68 °C menos ~15–18 K por creep y humedad]
    hdt_min_purchase_c: 70.0  # [VERIFICADO: research/R05 — comprar PETG con HDT(1,8 MPa) ≥ 70 °C, p. ej. PolyLite 75 °C]
    price_eur_per_kg: 22.0    # [ESTIMADO: PETG 1 kg EU 18–28 €]
  ASA:
    density_g_cm3: 1.07       # [ESTIMADO]
    sigma_t_xy_mpa: 40.0      # [ESTIMADO]
    sigma_t_z_mpa: 22.0       # [ESTIMADO]
    E_mpa: 2000.0             # [ESTIMADO]
    tg_c: 100.0               # [ESTIMADO]
    t_service_max_c: 75.0     # [SUPUESTO]
    price_eur_per_kg: 26.0    # [ESTIMADO]
  design_factors:             # Factores de reducción FDM (multiplican la resistencia)
    f_water: 0.75             # [VERIFICADO: research/R05 S13 — PETG −17 a −28 % de tracción a 30 días en agua de mar]
    f_temp: 0.85              # [ESTIMADO: a 40 °C de servicio]
    f_process: 0.80           # [ESTIMADO: variabilidad de impresión, poros, costura]
    f_creep: 0.35             # [VERIFICADO: research/R05 S15 (fluencia de PETG impreso) — admisible sostenida ≈ 35 %]
    f_fatigue: 0.06           # [CALCULADO: research/R05 S16 — 30 % UTS a ~1e5 ciclos, Basquin → ~6 % a 1e7–1e8 (paso de pala)]
    f_fatigue_lcf: 0.15       # [CALCULADO: misma curva Basquin a ~1e6 ciclos (olas, maniobras, ~1e5–1e6 por temporada)]
    f_z: 0.40                 # [VERIFICADO: research/R05 — Z/XY = 0,38 (Prusament) a 0,84 (PolyLite)]
  fs_target_printed: 3.0      # [VERIFICADO: requisito del usuario FS ≥ 3]
  fs_target_metal: 2.0        # [SUPUESTO: metales con propiedades certificadas]

printer:
  model: "Creality Ender-3 S1"    # [VERIFICADO: dato del usuario]
  envelope_mm: [210, 210, 260]    # [VERIFICADO: dato del usuario (X, Y, Z)]
  nozzle_mm: 0.4                  # [VERIFICADO: dato del usuario]
  hotend_max_c: 260               # [VERIFICADO: dato del usuario]
  bed_max_c: 100                  # [VERIFICADO: dato del usuario]
  layer_mm: 0.20                  # [SUPUESTO: perfil estructural]
  print_rate_g_h: 18.0            # [ESTIMADO: PETG 0.4 mm a ~60 mm/s con 6 perímetros]

geometry:
  clearance_mm: 0.25          # [SUPUESTO: holgura inicial 0.2–0.3, confirmar con probeta]
  press_fit_mm: -0.05         # [SUPUESTO: interferencia para rodamientos en PETG (confirmar con probeta)]
  min_wall_mm: 3.2            # [SUPUESTO: 8 perímetros de 0.4 mm]
  bolt_clearance_mm: 0.4      # [SUPUESTO: agujero pasante = d + 0.4]
  interference_tol_mm3: 1.0   # [SUPUESTO: volumen de intersección admisible (ruido numérico)]
  tilt_check_step_deg: 5.0    # [SUPUESTO: paso de barrido de basculación en verify]
  esc_box_inner_mm: [160, 110, 45]  # [CALCULADO: ESC 103×58×24 + antichispa 84×45×17 lado a lado + contratuercas M20 y curvas de cable (checks de ELE-01)]
  oring_cs_mm: 3.53           # [VERIFICADO: research/R05 — con ±0,15 mm de tolerancia FDM la compresión queda en 21–29 % (con 2,5 mm: 17–33 %)]
  oring_squeeze_frac: 0.25    # [VERIFICADO: research/R05 S24 Parker ORD 5700 — sello de cara estático 20–30 %]
  oring_gland_fill_frac: 0.78 # [VERIFICADO: research/R05 S24 — llenado 60–85 % (ranura 2,57–2,72 × 4,50–4,75 mm)]

costs:
  shipping_frac: 0.10         # [ESTIMADO: envío ~10 % del material comprado; no se aplica a ítems con envío incluido (ship: incl) ni a importación CN (ship: cn)]
  contingency_frac: 0.10      # [SUPUESTO: imprevistos]
  selection_cost_band_frac: 0.10   # [SUPUESTO: opciones dentro de +10 % del mínimo se desempatan por V máx y autonomía]
  hardware_fixed_eur: 0.0     # [CALCULADO: se suma desde la BOM]
  import_vat_frac: 0.25       # [VERIFICADO: research/R08a §0 — IVA DK 25 %, siempre debido en compras fuera de la UE]
  cn_shipping_eur: 45.0       # [ESTIMADO: research/R08a §0 — Flipsky no publica el envío DHL a DK; buscar en el checkout]

# -----------------------------------------------------------------------------
# OPERACIÓN Y REQUISITOS (plano de Jorge + reglas del proyecto)
# -----------------------------------------------------------------------------
operation:
  n_persons: 1                # [VERIFICADO: plano de Jorge — 1 piloto; research/R10b H6 (capacidad < 2 personas)]
  top_speed_target_kmh: 30.0  # [VERIFICADO: plano de Jorge "objetivo de velocidad ≥ 30 km/h"]
  legal_speed_limit_kmh: 9.26 # [VERIFICADO: research/R07 — ≤ 5 kn dentro de 300 m de la costa]
  mission_fast_h: 0.25        # [SUPUESTO: 15 min a fondo fuera de la franja de 300 m]
  mission_legal_h: 0.50       # [SUPUESTO: 30 min a 5 kn entrando/saliendo y dentro de la franja]
  reserve_frac: 0.20          # [SUPUESTO: 20 % de reserva]
  plane_margin_frac: 0.10     # [SUPUESTO: empuje ≥ 1,10 × R en toda la joroba (banda de diseño, batería nominal)]
  wave_added_frac: 0.10       # [ESTIMADO: ola corta del fiordo]
  accel_target_s: 15.0        # [SUPUESTO: tiempo máximo de 0 a planeo]
  success:                    # criterios pasa/no-pasa de las pruebas físicas (06 §T)
    bollard_frac: 0.80        # [SUPUESTO: empuje a punto fijo medido ≥ 80 % del modelo]
    vmax_frac: 0.85           # [SUPUESTO: V máx. medida (GPS) ≥ 85 % del modelo, banda nominal]
    p_legal_frac: 1.30        # [SUPUESTO: P de batería a 5 kn ≤ 1,3 × modelo]

# -----------------------------------------------------------------------------
# RESISTENCIA (research/R10b §4.4; R09 §1.6; Savitsky 1964 vía openplaning)
# -----------------------------------------------------------------------------
resistance:
  fn_hump: 1.5                # [ESTIMADO: research/R10b §4.4 — joroba a SLR ≈ 3 (Fn∇ ≈ 1,4–1,7)]
  fn_planing: 2.3             # [ESTIMADO: research/R10b §4.4 — Savitsky extrapola por debajo de Fn∇ ≈ 2,3] — corte arbitrario de la transición: sensibilidad 2,0–2,7 en 02 §10
  hump_exponent: 2.2          # [ESTIMADO: forma de R/Δ ∝ Fn∇^k por debajo de la joroba]
  r_hump: {low: 0.10, nominal: 0.15, high: 0.20}   # [ESTIMADO: research/R10b §4.4 — banda R/Δ 0,10–0,20 en la joroba]
  planing_band: {low: 0.92, nominal: 1.00, high: 1.12}   # [ESTIMADO: research/R10b §4.4 — dispersión de 6 cascos a 30 km/h (±8–12 %)]; en el régimen limitado por eslora (todo el planeo de este casco) la alta ×1,12 es [SUPUESTO]: sensibilidad 1,00–1,25 en 02 §10
  planing_factor: 1.0         # [SUPUESTO: factor de calibración sobre las tres bandas de planeo; 1 hasta medir la curva P–V (T4); sensibilidad ±10 %]
  full_planing_tol: 0.02      # [SUPUESTO: "planeo pleno" = primer nodo donde el Savitsky limitado por eslora y el libre difieren < 2 % (la eslora ya no limita); hasta ahí se exige el margen de empuje]
  planing_node_step_ms: 0.4   # [SUPUESTO: paso de los nodos de Savitsky (≈ 1,4 km/h)]
  design_band: "high"         # [SUPUESTO: se dimensiona con la banda alta]
  radius_gyration_m: 0.50     # [ESTIMADO: research/R10b §4.4]
  thrust_height_m: 0.11       # [CALCULADO: eje del jet ≈ 115 mm sobre la quilla (R10a §5.2)]
  air_center_m: 0.80          # [ESTIMADO]
  air_height_m: 1.10          # [ESTIMADO: research/R10b §4.4 — piloto sentado + consola]
  air_width_m: 0.50           # [ESTIMADO: research/R10b §4.4]
  air_cd: 0.90                # [ESTIMADO: research/R10b §4.4]
  hull_roughness_m: 150.0e-6  # [ESTIMADO: research/R10b §4.4 (openplaning por defecto)]
  v_max_eval_ms: 14.0         # [SUPUESTO: nodos de resistencia hasta 50 km/h (el punto de diseño de la bomba cae por encima de 40 km/h); las curvas de prestaciones se barren hasta 40 km/h]

# -----------------------------------------------------------------------------
# WATERJET — toma, bomba, tobera, dirección, reversa (research/R10a, R10b, R03, R12)
# -----------------------------------------------------------------------------
waterjet:
  impeller_d_options_mm: [100, 108, 120, 132]   # [SUPUESTO: Ø108 del plano de Jorge ± tamaños comerciales (JT132)]
  nozzle_ratio_options: [0.58, 0.62, 0.66, 0.70, 0.74]   # [SUPUESTO: D_tobera/D_impulsor; plano de Jorge 72/108 = 0,667]
  design_power_frac_options: [0.0, 0.5, 1.0]   # [SUPUESTO: potencia de diseño de la bomba = P_cont + f·(P_máx − P_cont)]
  hub_ratio: 0.50             # [CALCULADO: research/R12 §3 — con 0,40 el cubo da D_f 0,60; con 0,50, D_f 0,44 (Peerless 0,45, Oshima 0,483 VERIFICADO allí)]
  blades: 5                   # [CALCULADO: research/R12 §3 — Z = 5 con solidez 1,3/0,95/0,7; el plano de Jorge dice 4 (cambio documentado en decisiones.md)]
  stator_vanes: 7             # [CALCULADO: research/R12 §4 — 7 álabes, coprimo con 5]
  tip_clearance_frac: 0.003   # [CALCULADO: research/R12 §3 — 0,3–0,4 mm con anillo de desgaste torneado en sitio (0,003·132 = 0,40); Ladd usó 0,5 % (R03 S10)]
  nozzle_cc: 0.98             # [ESTIMADO: tobera cónica pulida]
  nozzle_loss_k: 0.02         # [VERIFICADO: research/R12 §2 (Bulten ec. 2.56) φ_n = 0,02]
  intake_eta: 0.70            # [ESTIMADO: research/R03 S9 — "~70 %" de recuperación es un valor general de tomas enrasadas, no de esta toma; sensibilidad 0,55–0,85 en 02 §10]
  grille_k: 0.40              # [ESTIMADO: research/R10a §4 — Kirschmer 0,2 (perfilada) a 0,6 (rectangular)]
  grille_open_area_m2_per_Aimp: 3.15   # [CALCULADO: research/R10a §5.2 — área efectiva con rejilla 3,15 × A_impulsor]
  axis_height_m: 0.115        # [CALCULADO: research/R10a §5.2 — eje en la cara del impulsor 115 mm sobre la quilla]
  throat_d_ratio: 1.11        # [CALCULADO: research/R10a §5.2 — garganta de la toma Ø1,11·D (Ø120 para D 108); la usan 04_diseno/params.py (D_throat) y el IVR de sizing]
  shaft_incline_deg: 5.0      # [VERIFICADO: research/R10a §4 — bloque de toma estándar de 5° (Hamilton)]
  ramp_angle_deg: 27.0        # [ESTIMADO: research/R10a §4 — entre 25° (S8) y < 30° (S7)]
  nozzle_height_above_wl_m: 0.0   # [SUPUESTO: tobera en la flotación en marcha]
  wake_fraction: 0.0          # [SUPUESTO: sin estela (R10b §4.5) — conservador para el empuje (no recupera estela); Bulten usa w = 0,12 en jets grandes (R10a S1); sensibilidad 0–0,10 en 02 §10]
  thrust_deduction: 0.0       # [SUPUESTO: R10b §4.5 — NO conservador: con t > 0 el empuje útil baja (1 − t) y cerca de la joroba es donde más pesa; sin fuente abierta con valores para jets chicos → se deja 0 y se muestra la sensibilidad 0–0,10 (02 §10, D-22)]
  pump:
    eta_design: 0.72          # [ESTIMADO: research/R12 §2 — η máx. 0,756 por Bulten ec. 2.26 para este Q y Ω_s; rango 0,65–0,75]
    shutoff_slope: 1.5        # [ESTIMADO: impulsor axial: ψ_cierre ≈ 2,5 × ψ_d → pendiente 1,5 (refinar con R12)]
    eta_curvature: 2.5        # [ESTIMADO: pico de η angosto de bomba axial (refinar con R12)]
    eta_min: 0.20             # [SUPUESTO: piso numérico]
    suction_s_max: 3.5        # [VERIFICADO: research/R12 §5 (Bulten) — S 3,5 de diseño, ~4,0 comercial]
    tip_speed_max_ms: 35.0    # [VERIFICADO: research/R10a §4 (S9) — límite práctico 35–45 m/s]
    phi_range: [0.15, 0.40]   # [ESTIMADO: research/R10b §4.6 φ 0,24–0,30 para Ø108; rango de waterjets]
    omega_s_range: [2.5, 6.0] # [ESTIMADO: axial/mixto (R10b §4.6)]
  steering:
    max_deflection_deg: 25.0  # [ESTIMADO: boquillas de jets chicos ±20–30°]
  shear_pin:                  # fusible mecánico impulsor–eje (research/R12 §7.6: una piedra libera ~490 J; el límite de corriente no protege)
    material: "Al 6061-T6"
    tau_u_mpa: 174.0          # [CALCULADO: research/R12 §7.6 — τ_u = 0,6 × UTS 290 MPa] (cota baja: dimensiona el pasador)
    tau_u_hi_mpa: 207.0       # [ESTIMADO: resistencia al corte típica de tablas para 6061-T6 (30 ksi), la que usaba research/R09 §5.3; no verificada en fuente abierta] (cota alta: FS del eje al corte)
    fuse_factor_vs_tmax: 1.8  # [SUPUESTO: corta a 1,8 × el par máx. que deja pasar el controlador (no corta en arranques)]
    d_options_mm: [3.0, 3.5, 4.0, 4.5, 5.0]   # [SUPUESTO: pasadores comerciales / torneados]
  cooling:                    # refrigeración por agua del motor y del controlador desde la bomba (como jetboards)
    orifice_d_mm: 4.0         # [SUPUESTO: restrictor en la toma de agua de la carcasa del estator]
    cd: 0.6                   # [ESTIMADO: orificio de canto vivo]
    dT_max_k: 15.0            # [SUPUESTO: salto de temperatura del agua de refrigeración]
  reverse:
    thrust_frac: 0.45         # [ESTIMADO: research/R12 §7 — Hamilton: reversa hasta 60 % (VERIFICADO allí); 0,45 conservador para el empuje útil]
    power_limit_frac: 0.50    # [SUPUESTO: límite de corriente en reversa (R10b H10)]

# -----------------------------------------------------------------------------
# TREN: eje, rodamientos, sello, acople
# -----------------------------------------------------------------------------
drivetrain:
  coupling: "Acople flexible de mordazas motor–eje (directo, sin reducción)"   # [VERIFICADO: plano de Jorge — motor directo 4500 rpm; acople: research/R10b H16]
  eta_mech: 0.98              # [ESTIMADO: research/R10b §4.5 — rodamientos + sello + acople]

shaft:
  d_mm: 20.0                  # [VERIFICADO: plano de Jorge "eje Ø20 mm"]
