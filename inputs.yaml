  PETG:
    density_g_cm3: 1.27       # [ESTIMADO: TDS típicos PETG 1.27]
    sigma_t_xy_mpa: 47.0      # [VERIFICADO: research/R05 S1 Prusament PETG TDS 47±2 MPa (PolyLite 50.8)]
    sigma_t_z_mpa: 18.0       # [VERIFICADO: research/R05 S1 "interlayer adhesion" 18±4 MPa]
    E_mpa: 1500.0             # [VERIFICADO: research/R05 S1 Prusament 1500 MPa (el menor de los TDS: conservador para deformación)]
    tg_c: 69.0                # [VERIFICADO: research/R05 S3 Bambu 69 °C (PolyLite 81); HDT 68 °C a 1,8 MPa]
    t_service_max_c: 50.0     # [ESTIMADO: research/R05 — HDT 65,7–68 °C menos ~15–18 K por creep y humedad]
    hdt_min_purchase_c: 70.0  # [VERIFICADO: research/R05 — comprar PETG con HDT(1,8 MPa) ≥ 70 °C, p. ej. PolyLite 75 °C]
    price_eur_per_kg: 22.0    # [ESTIMADO: PETG 1 kg EU 18–28 €]
  ASA:
    density_g_cm3: 1.07       # [ESTIMADO]
    sigma_t_xy_mpa: 40.0      # [ESTIMADO]
    sigma_t_z_mpa: 22.0       # [ESTIMADO]
    E_mpa: 2000.0             # [ESTIMADO]
    tg_c: 100.0               # [ESTIMADO]
    t_service_max_c: 75.0     # [SUPUESTO]
    price_eur_per_kg: 26.0    # [ESTIMADO]
  design_factors:             # Factores de reducción FDM (multiplican la resistencia)
    f_water: 0.75             # [VERIFICADO: research/R05 S13 — PETG −17 a −28 % de tracción a 30 días en agua de mar]
    f_temp: 0.85              # [ESTIMADO: a 40 °C de servicio]
    f_process: 0.80           # [ESTIMADO: variabilidad de impresión, poros, costura]
    f_creep: 0.35             # [VERIFICADO: research/R05 S15 (fluencia de PETG impreso) — admisible sostenida ≈ 35 %]
    f_fatigue: 0.06           # [CALCULADO: research/R05 S16 — 30 % UTS a ~1e5 ciclos, Basquin → ~6 % a 1e7–1e8 (paso de pala)]
    f_fatigue_lcf: 0.15       # [CALCULADO: misma curva Basquin a ~1e6 ciclos (olas, maniobras, ~1e5–1e6 por temporada)]
    f_z: 0.40                 # [VERIFICADO: research/R05 — Z/XY = 0,38 (Prusament) a 0,84 (PolyLite)]
  fs_target_printed: 3.0      # [VERIFICADO: requisito del usuario FS ≥ 3]
  fs_target_metal: 2.0        # [SUPUESTO: metales con propiedades certificadas]

