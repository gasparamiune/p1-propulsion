2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="460.85626911314984" x2="460.85626911314984" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="270.42813455657495" y="57">47.9</text><text font-family="DejaVu Sans" font-size="10" x="40" y="340.0">65.4</text><text font-family="DejaVu Sans" font-size="11" x="80" y="625.0">Espesor 5.0 mm</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="790" /><text font-size="12" font-weight="bold" x="978" y="808">P1-REV-10  recorrido_vaina</text><text font-size="10" font-weight="normal" x="978" y="825">Material: comprado (vaina Ø5 PTFE + cable inox Ø1,5)</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 7.95:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• Línea media en el plano XZ (marco de la boquilla), Y = -11,6 (émbolo +Y) y 36,9 (émbolo −Y)</text><text font-size="10" x="20" y="805">• Curva R40 (≥ R30 mínimo de la vaina [ESTIMADO]) de 31,4 mm + recta a 45° de 51,1 mm</text><text font-size="10" x="20" y="820">• Atar las dos vainas al montante con brida inox; bucle libre ≈ 0,5 m (R ≥ 150) hasta el prensaestopas P1-CTL-05</text><text font-size="10" x="20" y="835">• Regulador M6 + contratuerca en cada pestaña de P1-REV-09: con el bucket trabado, cable apenas flojo (pomo apoyado en la tapa); si el cable queda tenso, el perno no entra</text></g></svg>