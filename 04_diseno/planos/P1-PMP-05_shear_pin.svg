<svg baseProfile="full" height="620" version="1.1" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="620" width="1400" x="0" y="0" /><line stroke="black" stroke-dasharray="12,3,3,3" stroke-width="0.6" x1="40" x2="1360.0" y1="200" y2="200" /><rect fill="#e8e8e8" height="151.864406779661" stroke="black" stroke-width="1" width="1280.0" x="60" y="124.0677966101695" /><text font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="700.0" y="204">Ø3.5</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="1340.0" y1="297.93220338983053" y2="297.93220338983053" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="293.93220338983053" y2="301.93220338983053" /><line stroke="#0050a0" stroke-width="0.8" x1="1340.0" x2="1340.0" y1="293.93220338983053" y2="301.93220338983053" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="700.0" y="294.93220338983053">29.5</text><text fill="#444" font-family="DejaVu Sans" font-size="8" x="62" y="114.0677966101695">Ø3,50 h8 — SEMIPASADOR (2 por juego)</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="1340.0" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="1340.0" x2="1340.0" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="700.0" y="57">Largo total 29.5</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="510" /><text font-size="12" font-weight="bold" x="978" y="528">P1-PMP-05  shear_pin</text><text font-size="10" font-weight="normal" x="978" y="545">Material: Al 6061-T6 barra Ø3,5 h8</text><text font-size="10" font-weight="normal" x="978" y="562">Escala 43.39:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Fusible: 2 semipasadores (uno desde +Y y otro desde −Y, se tocan en el centro del eje); 2 secciones de corte a r_eje → corta a ≈ 33,5 N·m (sizing.mech.shear_pin). Llevar 3 juegos de repuesto (6 piezas).</text><text font-size="10" x="20" y="525">• Extremos con chaflán 0,3 × 45°; reemplazar cada temporada / 50 h y tras cualquier golpe [ESTIMADO]; no sustituir por acero.</text><text font-size="10" x="20" y="540">• Se cambian con el impulsor en el eje: sacar tobera y estator por popa, deslizar el anillo retén, botador corto Ø3 (≤ 33 mm).</text></g></svg>