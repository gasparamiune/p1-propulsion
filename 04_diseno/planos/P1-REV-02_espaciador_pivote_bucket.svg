ack" stroke-width="1" width="121.0" x="203.6111111111111" y="138.88888888888889" /><text font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="264.1111111111111" y="204">Ø20</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="324.6111111111111" y1="364.0" y2="364.0" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="360.0" y2="368.0" /><line stroke="#0050a0" stroke-width="0.8" x1="324.6111111111111" x2="324.6111111111111" y1="360.0" y2="368.0" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="192.30555555555554" y="361.0">43.3</text><text fill="#444" font-family="DejaVu Sans" font-size="8" x="205.6111111111111" y="56.0">muñón Ø20 h7, Ra 0,8 (gira el buje POM)</text><line stroke="red" stroke-width="0.8" x1="179.16666666666666" x2="179.16666666666666" y1="40.0" y2="200" /><text fill="red" font-family="DejaVu Sans" font-size="9" x="182.16666666666666" y="38.0">cara de apoyo de la brida: plana, a escuadra ≤ 0,02 con el piloto</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="324.6111111111111" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="324.6111111111111" x2="324.6111111111111" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="192.30555555555554" y="57">Largo total 43.3</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="510" /><text font-size="12" font-weight="bold" x="978" y="528">P1-REV-02  espaciador_pivote_bucket</text><text font-size="10" font-weight="normal" x="978" y="545">Material: Dúplex 1.4462 (2205) +AT barra Ø40, certificado 3.1 (Rp0,2 ≥ 450)</text><text font-size="10" font-weight="normal" x="978" y="562">Escala 6.11:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Agujero Ø12,5 pasante (tornillo ISO 4017 M12 × 60 A4-80); ×2</text><text font-size="10" x="20" y="525">• Montaje: Tef-Gel en el piloto y la cara de la brida (NO en la rosca); arandela ISO 7089 M12 bajo la cabeza,</text><text font-size="10" x="20" y="540">•   espaciador, oreja, arandela ancha ISO 7093 (Ø37 × 3) y tuerca baja ISO 4035 M12 A4-035 por dentro;</text><text font-size="10" x="20" y="555">•   Loctite 243 en la rosca del M12 (par bajo: el tornillo solo retiene; corte y momento por el piloto)</text><text font-size="10" x="20" y="570">• Par 12 N·m → precarga 4–7 kN (K 0.15–0.28 [ESTIMADO])</text><text font-size="10" x="20" y="585">• El piloto (19.5 mm) es 0,5 más corto que la oreja: aprieta la brida, no el piloto</text><text font-size="10" x="20" y="600">• Juego axial del bucket 0,3 mm contra la arandela de la cabeza (verificar a mano: gira libre)</text></g></svg>