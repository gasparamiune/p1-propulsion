2 mm; recto hasta la salida</text><text font-size="10" x="20" y="525">• Orejas de pivote ±Z: cara a |Z| = 57.42 (−0,1/0), R12.5 alrededor del eje de giro; M6×8 en el eje</text><text font-size="10" x="20" y="540">• Orejas del bucket |Y| 40–48; +Y: M20×1,5 del émbolo en X'=90.5, Z=89.7</text><text font-size="10" x="20" y="555">• Hueco de las orejas de la bomba (|Z| 58.92–70.92): fresar el barrido ±30° (STEP)</text><text font-size="10" x="20" y="570">• Cotas 3D completas en step/P1-STE-01_boquilla.step (marco JET, δ = 0)</text></g></svg>