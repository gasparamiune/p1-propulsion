<svg baseProfile="full" height="900" version="1.1" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="900" width="1400" x="0" y="0" /><rect fill="#eeeeee" height="396.28099173553716" stroke="black" width="700.0" x="80" y="80" /><circle cx="227.5206611570248" cy="278.14049586776855" fill="white" r="89.66942148760332" stroke="black" /><text font-family="DejaVu Sans" font-size="9" x="319.1900826446281" y="276.14049586776855">1</text><text font-family="DejaVu Sans" font-size="11" font-weight="bold" x="820.0" y="80">Agujeros (origen: esquina inferior izquierda)</text><text font-family="DejaVu Sans" font-size="10" x="820.0" y="98">1: x=5.1  y=6.8  Ø6.2  ranura 6,2 × 9,7 VERTICAL (perno de manivela)</text><line stroke="#0050a0" stroke-width="0.8" x1="80" x2="780.0" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="80" x2="80" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="780.0" x2="780.0" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="430.0" y="57">24.2</text><text font-family="DejaVu Sans" font-size="10" x="40" y="278.14049586776855">13.7</text><text font-family="DejaVu Sans" font-size="11" x="80" y="501.28099173553716">Espesor 5.0 mm</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="790" /><text font-size="12" font-weight="bold" x="978" y="808">P1-REV-09  eslabon</text><text font-size="10" font-weight="normal" x="978" y="825">Material: 1.4401 (AISI 316)</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 28.93:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• ×2. ESLABÓN RÍGIDO (DES-04): ojo 10,2 × 13,7 × 5 con la ranura + vástago M4 × 14 en el eje (torneado y fresado de barra Ø16)</text><text font-size="10" x="20" y="805">• El vástago se rosca en la rosca M4 axial de la cola del perno del émbolo (P1-REV-04) con Loctite 243</text><text font-size="10" x="20" y="820">• Largo cara del pomo → eje del perno 8,25 (luz ojo ↔ pomo 3,15); ajuste ±2 por medias vueltas (0,35): la ranura queda vertical; cadena de tolerancias 0,95</text><text font-size="10" x="20" y="835">• Montaje: bucket trabado, pomo apoyado en la tapa y Bowden flojo: ajustar hasta que el perno de manivela quede a la altura del eje del émbolo; después, el regulador M6</text></g></svg>