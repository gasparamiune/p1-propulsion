text><text font-size="10" font-weight="normal" x="978" y="545">Material: AISI 316 (1.4404) tubo/barra torneado</text><text font-size="10" font-weight="normal" x="978" y="562">Escala 1.54:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Ø interior 133,32 H7 = D 132,0 + 2 × holgura 0,66; tornear el Ø interior DESPUÉS de prensar en la carcasa (TIR ≤ 0,05 respecto del asiento).</text><text font-size="10" x="20" y="525">• Prensado H7/p6 + Loctite 648; apoya contra el escalón de la carcasa en X_ring0 = -6,6 (marco JET).</text><text font-size="10" x="20" y="540">• Reemplazar si la holgura de punta medida con galgas supera 0,8 mm (R12 §2.7).</text></g></svg>