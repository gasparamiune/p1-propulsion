/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Interior Ø16 H8 pasante (guía del perno, Ra 0,8); rosca interior M20×1 × 6 atrás para la tapa; ×2</text><text font-size="10" x="20" y="525">• Contratuerca M24×1,5 A4 fina (12 mm) contra la cara interior de la oreja; Tef-Gel en la rosca</text><text font-size="10" x="20" y="540">• Resorte de compresión inox (B-SPRING): alambre 1,6, Ø ext 15, largo libre ≈ 40,</text><text font-size="10" x="20" y="555">•   instalado 30 (≈ 20 N), con el perno afuera 18 (≈ 44 N) [ESTIMADO]</text></g></svg>