0" font-weight="normal" x="978" y="825">Material: Al 6061-T6</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 10.68:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• Giro 50° → 14,8 mm de cable (liberar pide 9,5 + 3 de juego); dedos 29,9 mm a 35,4 del pivote</text><text font-size="10" x="20" y="805">• Barra igualadora AISI 316 5 × 4 × 24: pasador Ø4 al centro, ranuras de los terminales a ±8; gira libre</text><text font-size="10" x="20" y="820">• Tiro por cable con 100 N de mano: 106 N (η gatillo 0,95) ≥ 99 N = resorte 45,2 N / (η Bowden 0,6 · η balancín 0,76) [CALCULADO/ESTIMADO]</text><text font-size="10" x="20" y="835">• Tope de las vainas: pestaña 5 mm (2 × M6 con contratuerca) de la placa lateral soldada al mango de P1-CTL-10; resorte de torsión de retorno</text></g></svg>