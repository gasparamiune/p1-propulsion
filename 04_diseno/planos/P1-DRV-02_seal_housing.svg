ont-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Sello ST-MG1 Ø20 carbón/SiC/NBR (tipo MG1, EN 12756): pedir caras CARBÓN/SiC (arranques cortos en seco).</text><text font-size="10" x="20" y="525">• Asiento fijo prensado desde popa con agua jabonosa; cámara y alojamiento Ra 1,6; espigón concéntrico a la cara de brida ≤ 0,03.</text><text font-size="10" x="20" y="540">• Junta: Tef-Gel o arandelas aislantes en los M6 si el buje de la toma es de Al (par 316–Al, R10b H21).</text><text font-size="10" x="20" y="555">• Salida G1/8: espiga + manguera transparente Ø6 a la sentina (testigo de goteo).</text></g></svg>