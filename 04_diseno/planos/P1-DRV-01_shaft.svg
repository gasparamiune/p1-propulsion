cabeza del sello, retención a popa (opcional).</text><text font-size="10" x="20" y="570">• Montaje (A-08): caja del sello y cabeza entran por la PUNTA DE POPA; rodamientos/KM4/tapa/acople por PROA (ver params_tren.py).</text></g></svg>