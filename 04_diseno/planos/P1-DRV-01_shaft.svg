t><text font-size="10" x="20" y="540">• Asiento de hélice Ø12.7 = bore de la hélice comprada: MEDIR antes de tornear; retención según la hélice</text><text font-size="10" x="20" y="555">• Pasador de corte: AISI 316 Ø2.0 — corta a 12.4 N·m</text><text font-size="10" x="20" y="570">• Radio de transición r = 1 mm en todos los escalones; sin rayas transversales (fatiga)</text></g></svg>