roa 316 3 × 12 × 182; barras soldadas TIG a ambas.</text><text font-size="10" x="20" y="850">• Decapar y pasivar después de soldar; sin rebabas (R10a §8.6: escalón ≤ 2 mm). Origen del plano: x_bote = x + 339.3, y_bote = y − 91.2.</text><text font-size="10" x="20" y="865">• Desmontaje desde afuera: 4 × M5 A4 (Tef-Gel), con el sistema DESARMADO (R10a §0).</text></g></svg>