 x1="80" x2="80" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="609.4850486449648" x2="609.4850486449648" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="344.7425243224824" y="57">175.8</text><text font-family="DejaVu Sans" font-size="10" x="40" y="340.0">172.6</text><text font-family="DejaVu Sans" font-size="11" x="80" y="625.0">Espesor 8.0 mm</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="790" /><text font-size="12" font-weight="bold" x="978" y="808">P1-REV-01  bucket_brazo_estribor</text><text font-size="10" font-weight="normal" x="978" y="825">Material: Al 5083-H111</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 3.01:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• Brazo +Y (estribor del bote); contorno = STEP (posición ABAJO): placa principal + lóbulos r 18 alrededor de cada traba, el de la traba ABAJO unido al labio superior de la cuchara (sin muesca: FEA ronda 3)</text><text font-size="10" x="20" y="805">• Chapa 8 mm; aro de refuerzo Ø40 × 10 soldado en la cara exterior del pivote (buje POM Ø24 H7 × 18 pasante brazo + aro)</text><text font-size="10" x="20" y="820">• Agujeros de traba Ø16.5 (+0,1/0) DESPUÉS DE SOLDAR, con plantilla centrada en el agujero del buje Ø24 H7 (05 §bucket), posición ±0,2: cada traba sola lleva todo M_h, no hay reparto que ajustar</text><text font-size="10" x="20" y="835">• Cara INTERIOR del brazo en la zona de las trabas plana y a escuadra con el eje del buje ≤ 0,3 después de soldar (refrentar si no): el collar del émbolo queda a 1,0 mm (re-auditoría MECH-8)</text></g></svg>