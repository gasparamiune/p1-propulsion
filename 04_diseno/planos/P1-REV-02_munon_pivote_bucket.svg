nt-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Entra DESPUÉS del bucket, desde afuera, por el buje Ø20.1 hasta el fondo del casquillo, con Tef-Gel; ×2</text><text font-size="10" x="20" y="525">• Tornillo ISO 4017 M12 × 60 A4-80 con arandela ISO 7089 M12 bajo la cabeza sobre el extremo del muñón;</text><text font-size="10" x="20" y="540">•   por dentro arandela ancha ISO 7093 (Ø37 × 3) y tuerca baja ISO 4035 M12 A4-035, Loctite 243</text><text font-size="10" x="20" y="555">•   en la rosca del M12. Par 12 N·m → precarga 4–7 kN (K 0.15–0.28 [ESTIMADO]): solo retiene (cabeza → muñón → fondo del casquillo ← arandela)</text><text font-size="10" x="20" y="570">• Juego axial del bucket 0,3 mm contra la arandela de la cabeza (verificar a mano: gira libre)</text></g></svg>