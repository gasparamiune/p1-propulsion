" y="340.0">24.5</text><text font-family="DejaVu Sans" font-size="11" x="80" y="625.0">Espesor 5.0 mm</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="790" /><text font-size="12" font-weight="bold" x="978" y="808">P1-REV-09  balancin</text><text font-size="10" font-weight="normal" x="978" y="825">Material: Al 5083-H111</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 21.22:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• ×2 iguales (el del émbolo −Y va dado vuelta). Brazos 14 a 90° (1:1): la salida sube lo que corre el pomo</text><text font-size="10" x="20" y="805">• Pernos de manivela AISI 316 estirado Ø6: largo 34,8 (émbolo +Y) y 38,3 (émbolo −Y); ranura de anillo E a 2 mm del extremo</text><text font-size="10" x="20" y="820">• Eslabón al pomo: cable inox Ø1,5 con terminal en el ojal del pomo y lazo en el perno (10 mm cara del pomo → perno)</text></g></svg>