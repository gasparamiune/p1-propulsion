# P1 — Perfil de IMPRESIÓN «FUSIBLE / SACRIFICIAL» 0,20 mm (PrusaSlicer, clave = valor).
# Piezas: patín P1-PRP-02 (cintura fusible), segmentos del protector P1-PRP-01 + probeta P1.8 (cuello del patín).
# Por qué: el patín DEBE romper en su cintura con skeg_fuse_force (300 N) para proteger tubo, cuna y abrazadera
# (inputs.yaml propeller.skeg_fuse_force_n; params.skeg_neck_len). La carga de rotura depende de cuánto filamento
# corre a lo largo de la tensión de flexión en las fibras externas de la cintura: eso lo fijan el NÚMERO DE
# PERÍMETROS, el RELLENO y su ÁNGULO. Por eso este perfil los fija y NO se deben cambiar sin repetir P1.8:
#   · perímetros = 4 con generador CLÁSICO (ancho fijo, sin cordones de ancho variable de Arachne);
#   · relleno 100 % rectilíneo a 45° (sección llena = σ de rotura del material, sin dependencia del % de relleno);
#   · misma temperatura/ventilador/velocidad que la probeta (mismo filamento y misma tanda de impresión).
# Imprimir 3 probetas P1.8 JUNTO con cada patín (misma cama, misma bobina) como testigo de la tanda.
# El protector (consumible, fatiga a ~50 Hz) usa el mismo perfil: paredes llenas, research/R05 A6/A8.

layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
perimeter_generator = classic
top_solid_layers = 5
bottom_solid_layers = 5
top_solid_min_thickness = 1
bottom_solid_min_thickness = 1
fill_density = 100%
fill_pattern = rectilinear
top_fill_pattern = rectilinear
bottom_fill_pattern = rectilinear
fill_angle = 45
infill_every_layers = 1
infill_overlap = 25%
solid_infill_every_layers = 0
# Costura alineada: verificar en la vista previa que NO cae en los flancos de la cintura (si cae, pintar costura
# en la lengüeta). La costura es un entalle que adelantaría la rotura de forma no repetible.
seam_position = aligned
staggered_inner_seams = 0
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
gap_fill_enabled = 1
overhangs = 1
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.45
support_material_extrusion_width = 0.38
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 50
solid_infill_speed = 50
top_solid_infill_speed = 25
gap_fill_speed = 25
bridge_speed = 25
support_material_speed = 40
support_material_interface_speed = 100%
travel_speed = 150
travel_speed_z = 10
first_layer_speed = 20
default_acceleration = 0
perimeter_acceleration = 0
infill_acceleration = 0
bridge_acceleration = 0
first_layer_acceleration = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 50
support_material_buildplate_only = 1
support_material_contact_distance = 0.2
support_material_style = snug
support_material_pattern = rectilinear
support_material_spacing = 2.5
support_material_interface_layers = 2
dont_support_bridges = 1
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_type = outer_only
brim_width = 0
brim_separation = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
ironing = 0
avoid_crossing_perimeters = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = octoprint
output_filename_format = {input_filename_base}_P1fusible_{layer_height}mm_{filament_type[0]}_{print_time}.gcode
notes = P1 FUSIBLE: 4 perimetros CLASICOS + 100 % rectilineo a 45 grados, capa 0,20. NO CAMBIAR: fija la carga de rotura del patin (ensayo P1.8, 200-400 N). Imprimir 3 probetas P1.8 con cada patin.
