# P1 — Perfil de IMPRESIÓN «ESTRUCTURAL» 0,20 mm (PrusaSlicer, clave = valor).
# Piezas: soporte del kill switch y de la seta P1-CTL-03 (seguridad: el tirón del cordón tiene que sacar el clip, no
# romper el soporte) y toda pieza impresa no listada en familias.py + peines de holguras P1.1.
# Por qué: 04_diseno/structural.py verifica FS ≥ 3 sobre la SECCIÓN LLENA con σ = σt,XY · f_water · f_temp ·
# f_process; f_process (0,80) cubre poros y costura, NO un relleno ralo. Por eso: muchos perímetros (la flexión la
# llevan las fibras externas), relleno alto (≥ solid_frac del manifest: modificador por pieza en 05_fabricacion.md)
# y velocidades moderadas (mejor soldadura entre capas: el material es débil en Z, f_z = 0,40, research/R05 A3).

layer_height = 0.2
first_layer_height = 0.2
# 6 perímetros de 0,45 = 2,7 mm de pared [CALCULADO]; research/R05 A3 pide ≥ 6–8 perímetros en piezas cargadas.
perimeters = 6
perimeter_generator = arachne
# Sólidos: 6 arriba (1,2 mm) y 5 abajo (1,0 mm) [ESTIMADO: ≥ 1 mm de piel para flexión fuera del plano].
top_solid_layers = 6
bottom_solid_layers = 5
top_solid_min_thickness = 1.2
bottom_solid_min_thickness = 1
# Gyroid 85 % como base [SUPUESTO: sección casi llena, como supone structural.py]; piezas con solid_frac > 0,85 llevan
# modificador por objeto (tabla de 05_fabricacion.md). Gyroid: isotrópico en el plano.
fill_density = 85%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
infill_overlap = 25%
solid_infill_every_layers = 0
# Costura alineada (una línea, fácil de ubicar en zona no crítica con «pintar costura») y costuras internas
# escalonadas para no apilar el punto débil a través del espesor de pared [ESTIMADO].
seam_position = aligned
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
gap_fill_enabled = 1
overhangs = 1
# Anchos de extrusión [ESTIMADO: 1,1 × boquilla; 1.ª capa más ancha para adherir].
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.38
# Velocidades moderadas [ESTIMADO]; caudal pico 60 × 0,45 × 0,2 = 5,4 mm³/s < 8 del filamento [CALCULADO].
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 40
top_solid_infill_speed = 25
gap_fill_speed = 25
bridge_speed = 25
support_material_speed = 40
support_material_interface_speed = 100%
travel_speed = 150
travel_speed_z = 10
first_layer_speed = 20
default_acceleration = 0
perimeter_acceleration = 0
infill_acceleration = 0
bridge_acceleration = 0
first_layer_acceleration = 0
# Soportes apagados por defecto; activar por pieza donde 05_fabricacion.md lo indica (agujeros horizontales grandes).
support_material = 0
support_material_auto = 1
support_material_threshold = 50
support_material_buildplate_only = 1
support_material_contact_distance = 0.2
support_material_style = snug
support_material_pattern = rectilinear
support_material_spacing = 2.5
support_material_interface_layers = 2
dont_support_bridges = 1
# Adherencia: falda; borde (brim) por pieza si alto/huella > 2 (tabla de 05) [SUPUESTO: regla práctica].
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_type = outer_only
brim_width = 0
brim_separation = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
ironing = 0
avoid_crossing_perimeters = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = octoprint
output_filename_format = {input_filename_base}_P1estructural_{layer_height}mm_{filament_type[0]}_{print_time}.gcode
notes = P1 ESTRUCTURAL: 6 perimetros, 85 % gyroid (modificador por pieza = solid_frac), capa 0,20, costura alineada. No bajar perimetros ni relleno: structural.py supone seccion llena.
