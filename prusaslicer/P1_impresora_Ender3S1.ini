# P1 — Perfil de IMPRESORA para PrusaSlicer (formato config .ini: clave = valor).
# Creality Ender-3 S1, extrusor directo, boquilla 0,4, cama PC, SIN cerramiento.
# Cargar con:  prusa-slicer --load P1_impresora_Ender3S1.ini --load P1_filamento_PETG.ini --load P1_impresion_<familia>.ini
# o importar completo/P1_<familia>_completo.ini en la GUI (Archivo → Importar → Importar configuración).
# Etiquetas: [VERIFICADO: fuente] · [CALCULADO] · [ESTIMADO: base] · [SUPUESTO]. Los comentarios van en líneas
# propias (PrusaSlicer no admite comentarios al final de una línea clave = valor).

printer_technology = FFF
# Volumen ÚTIL declarado por el usuario 210 × 210 × 260 mm [VERIFICADO: inputs.yaml printer.envelope_mm].
# Cama física 220 × 220 [ESTIMADO: ficha comercial Ender-3 S1, no abierta en esta sesión]. La forma de cama se
# limita al cuadrado útil centrado (5…215) para que PrusaSlicer marque en rojo lo que salga de la zona útil.
bed_shape = 5x5,215x5,215x215,5x215
max_print_height = 260
# Boquilla de latón 0,4 de serie [VERIFICADO: inputs.yaml printer.nozzle_mm; material latón SUPUESTO, research/R05 A1].
nozzle_diameter = 0.4
# Firmware Marlin 2 de Creality con extrusor relativo [ESTIMADO: firmware de serie de la S1].
gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
# Límites de máquina emitidos al G-code (M201/M203/M204/M205) [ESTIMADO: valores moderados, por debajo de los
# típicos de Marlin para la S1; con PETG y piezas de 1–2 kg no conviene acelerar fuerte (vibración, capas)].
machine_limits_usage = emit_to_gcode
machine_max_acceleration_x = 1000
machine_max_acceleration_y = 1000
machine_max_acceleration_z = 100
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 1000
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 10
machine_max_feedrate_e = 60
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
# Alturas de capa admisibles con 0,4 [ESTIMADO: 20–70 % del Ø de boquilla].
min_layer_height = 0.08
max_layer_height = 0.28
# Retracción base (el filamento PETG la sobrescribe) [ESTIMADO: extrusor directo].
retract_length = 0.8
retract_speed = 35
deretract_speed = 0
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 0
retract_before_travel = 2
retract_layer_change = 1
wipe = 1
retract_before_wipe = 0%
z_offset = 0
extruder_colour = ""
extruder_offset = 0x0
single_extruder_multi_material = 0
remaining_times = 1
silent_mode = 0
thumbnails =
binary_gcode = 0
# G-code de inicio: cama → home → malla ABL guardada (CR-Touch) → boquilla → línea de purga dentro de la zona útil.
# M420 S1 activa la malla guardada con G29 [SUPUESTO: firmware con ABL; si no hay malla, correr G29 una vez y M500].
start_gcode = G90 ; posiciones absolutas\nM83 ; extrusor relativo\nM140 S[first_layer_bed_temperature] ; cama\nM104 S150 ; precalentar boquilla sin gotear\nM190 S[first_layer_bed_temperature] ; esperar cama\nG28 ; home\nM420 S1 ; malla ABL guardada\nM104 S[first_layer_temperature]\nM109 S[first_layer_temperature] ; esperar boquilla\nG1 Z2.0 F600\nG1 X6.0 Y20 F5000\nG1 Z0.28 F600\nG1 X6.0 Y200 F1500 E15 ; purga 1\nG1 X6.4 Y200 F5000\nG1 X6.4 Y20 F1500 E15 ; purga 2\nG1 Z2.0 F600\n
end_gcode = G1 E-2 F2400 ; retraer\nG91\nG1 Z10 F600 ; levantar\nG90\nG1 X10 Y210 F3000 ; presentar la pieza\nM104 S0 ; boquilla off\nM140 S0 ; cama off\nM107 ; ventilador off\nM84 X Y E ; motores off\n
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\nG92 E0 ; extrusor relativo: PrusaSlicer exige reponer E en cada capa\n;[layer_z]\n
toolchange_gcode =
color_change_gcode = M600
pause_print_gcode = M601
template_custom_gcode =
printer_notes = P1 Ender-3 S1 — zona útil 210x210x260 (usuario); boquilla 0,4 latón; cama PC; sin cerramiento: imprimir lejos de corrientes de aire. Boquilla endurecida SOLO si se imprime PETG-CF/PA-CF (P2), research/R05 A1.
