# P1 — Perfil de IMPRESIÓN «SELLADO» 0,15 mm (PrusaSlicer, clave = valor).
# Piezas: tapa de inspección de la toma P1-INT-04 (mojada, a presión, O-ring de cara y purga) + probetas P1.6
# (réplica reducida de la tapa y caja-brida) y P1.7 (absorción). La cara del O-ring va SOBRE LA CAMA (la más lisa).
# Por qué (research/R05 B4): zonas de sello con ≥ 4 perímetros [VERIFICADO: S22] y 100 % de relleno [ESTIMADO];
# capa 0,12–0,15 mm: Sa 10–13 µm contra 20–24 µm a 0,21 mm [VERIFICADO: S18]; costura lejos del cruce con el O-ring;
# las caras de sello se planchan y después se refrentan o lijan (Ra ≤ 0,8–1,6 µm requerido [VERIFICADO: S24, S26]).
# El PETG impreso "leaked … through the seams and contact points between perimeters and solid infill" [VERIFICADO: S22]
# → 100 % de relleno con solape alto para cerrar esos canales.

layer_height = 0.15
first_layer_height = 0.2
perimeters = 5
perimeter_generator = arachne
top_solid_layers = 8
bottom_solid_layers = 7
top_solid_min_thickness = 1.2
bottom_solid_min_thickness = 1
fill_density = 100%
fill_pattern = rectilinear
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
infill_overlap = 30%
solid_infill_every_layers = 0
# Costura atrás (+Y) y alineada: una línea vertical en el canto, nunca sobre la cara del O-ring.
seam_position = rear
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
gap_fill_enabled = 1
overhangs = 1
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.38
# Planchado de las caras superiores (en P1-INT-04: cara de las arandelas y resalte de la purga, donde apoya la arandela
# de estanqueidad) [ESTIMADO: alisa antes de lijar]. La cara del O-ring es la de cama.
ironing = 1
ironing_type = top
ironing_flowrate = 15%
ironing_spacing = 0.1
ironing_speed = 15
# Más lento que el estructural: cordones mejor soldados [ESTIMADO].
perimeter_speed = 30
external_perimeter_speed = 20
small_perimeter_speed = 15
infill_speed = 45
solid_infill_speed = 35
top_solid_infill_speed = 20
gap_fill_speed = 20
bridge_speed = 20
support_material_speed = 40
support_material_interface_speed = 100%
travel_speed = 150
travel_speed_z = 10
first_layer_speed = 20
default_acceleration = 0
perimeter_acceleration = 0
infill_acceleration = 0
bridge_acceleration = 0
first_layer_acceleration = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 50
support_material_buildplate_only = 1
support_material_contact_distance = 0.2
support_material_style = snug
support_material_pattern = rectilinear
support_material_spacing = 2.5
support_material_interface_layers = 2
dont_support_bridges = 1
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_type = outer_only
brim_width = 0
brim_separation = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
avoid_crossing_perimeters = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = octoprint
output_filename_format = {input_filename_base}_P1sellado_{layer_height}mm_{filament_type[0]}_{print_time}.gcode
notes = P1 SELLADO: capa 0,15, 5 perimetros, 100 % relleno con solape 30 %, planchado arriba, costura atras. Tapa P1-INT-04 con la ranura del O-ring sobre la cama; controlar planitud <= 0,10 mm y lapear si hace falta.
