# P1 — Perfil de IMPRESIÓN «CUBIERTAS» 0,20 mm (PrusaSlicer, clave = valor).
# Piezas: cubrecorrea P1-HSG-03 y capó del motor P1-HSG-05 (salpicaduras, manipulación leve; sin sello: drenan).
# Por qué: no están en la ruta de carga (research/R05 A8: "sin sellar, con drenaje"); se prioriza peso y tiempo con
# paredes suficientes para golpes leves. Capó ≤ 60 °C en la pieza sin carga [ESTIMADO: research/R05 A4].

layer_height = 0.2
first_layer_height = 0.2
# 3 perímetros = 1,35 mm; las paredes del CAD (cover_wall 2,4 mm) quedan casi macizas [CALCULADO].
perimeters = 3
perimeter_generator = arachne
top_solid_layers = 5
bottom_solid_layers = 4
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0.7
fill_density = 25%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
infill_overlap = 25%
solid_infill_every_layers = 0
seam_position = aligned
staggered_inner_seams = 0
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
gap_fill_enabled = 1
overhangs = 1
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.38
perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 70
solid_infill_speed = 50
top_solid_infill_speed = 30
gap_fill_speed = 30
bridge_speed = 30
support_material_speed = 50
support_material_interface_speed = 100%
travel_speed = 150
travel_speed_z = 10
first_layer_speed = 20
default_acceleration = 0
perimeter_acceleration = 0
infill_acceleration = 0
bridge_acceleration = 0
first_layer_acceleration = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 50
support_material_buildplate_only = 1
support_material_contact_distance = 0.2
support_material_style = snug
support_material_pattern = rectilinear
support_material_spacing = 2.5
support_material_interface_layers = 2
dont_support_bridges = 1
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_type = outer_only
brim_width = 0
brim_separation = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
ironing = 0
avoid_crossing_perimeters = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = octoprint
output_filename_format = {input_filename_base}_P1cubiertas_{layer_height}mm_{filament_type[0]}_{print_time}.gcode
notes = P1 CUBIERTAS: 3 perimetros, 25 % gyroid, capa 0,20. Solo capo y cubrecorrea (sin carga, con drenaje).
