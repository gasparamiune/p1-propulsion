# P1 — Perfil de IMPRESIÓN «CUBIERTAS» 0,20 mm (PrusaSlicer, clave = valor): cubiertas y carcasas SECAS.
# Piezas: base del controlador P1-ELE-01 (+ probeta P1.4 de su inserto M5), capota P1-ELE-02 y caja de palancas
# P1-CTL-02 (familias.py). Van secas (sobre el piso o la consola), fuera de la ruta de carga de mando; FS ≥ 3,8 en
# resultados/estructural.json. Orientación del manifest de CTL-02: "0,2 mm, 5 perímetros, 30 % giroide".

layer_height = 0.2
first_layer_height = 0.2
# 5 perímetros = 2,25 mm por lado: las paredes de 3,2–3,5 mm del CAD quedan macizas y los nervios de los
# insertos M5 de ELE-01 tienen ≥ 2,25 mm de perímetro alrededor del agujero [CALCULADO].
