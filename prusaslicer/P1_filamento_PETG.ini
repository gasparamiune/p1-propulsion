# P1 — Perfil de FILAMENTO PETG para PrusaSlicer (formato config .ini: clave = valor).
# Fuentes (TDS abiertos en esta sesión, ver research/R05 §0): S1 Prusament PETG TDS v1.1, S2 Polymaker PolyLite PETG
# TDS V6.0, S3 Bambu PETG Basic TDS V3.0. Comprar PETG con HDT(1,8 MPa) ≥ 70 °C [VERIFICADO: research/R05 A1; PolyLite 75 °C].
# Límites de la máquina: boquilla ≤ 260 °C, cama ≤ 100 °C [VERIFICADO: inputs.yaml printer.hotend_max_c / bed_max_c].
#
# SECADO antes de imprimir: 65 °C × 6–8 h [VERIFICADO: S2 "65°C/6H" en condiciones recomendadas; S3 "Blast Drying
# Oven: 65 °C, 8 h"]; guardar en caja estanca con desecante, HR < 20 % [VERIFICADO: S3 "Printing and Storage Humidity
# < 20% RH (Sealed, with desiccant)"]. Síntomas de filamento húmedo: chasquidos, hilos, superficie áspera.
# CAMA PC con AGENTE SEPARADOR: pegamento en barra en capa fina. PolyLite lista "PC and Texture PEI" como superficie
# [VERIFICADO: S2]; Prusament pide pegamento en barra sobre PEI liso [VERIFICADO: S1 "smooth PEI sheet*) with a glue
# stick"] y Bambu lo recomienda [VERIFICADO: S3 "Glue: Recommended"]. Sin separador el PETG puede arrancar trozos
# de la superficie lisa al despegar [ESTIMADO: experiencia común con PETG sobre superficies lisas].

filament_type = PETG
filament_diameter = 1.75
# Densidad [ESTIMADO: TDS típicos 1,27 g/cm³; = inputs.yaml materials.PETG.density_g_cm3].
filament_density = 1.27
# Precio [ESTIMADO: inputs.yaml materials.PETG.price_eur_per_kg].
filament_cost = 22
filament_spool_weight = 0
filament_soluble = 0
# Calibrar con un cubo de pared simple; 1,00 de partida [SUPUESTO].
extrusion_multiplier = 1
# Boquilla 245 °C: dentro de 230–260 (S2, S3) y de 250 ± 10 (S1) [VERIFICADO: rangos]; elegido al medio para adhesión
# entre capas sin hilos [ESTIMADO]. Si las probetas muestran capas mal soldadas (P1.6 pierde por poros), subir a
# 250 °C (≤ 260 de la máquina).
first_layer_temperature = 245
temperature = 245
# Cama 80 °C en la 1.ª capa, 75 °C después: rangos 80 ± 10 (S1), 70–80 (S2), 65–75 (S3) [VERIFICADO: rangos];
# ≤ 100 °C de la máquina.
first_layer_bed_temperature = 80
bed_temperature = 75
# Ventilador bajo: más adhesión entre capas (piezas estructurales). PolyLite pide OFF–20 % [VERIFICADO: S2],
# Prusament 50 % [VERIFICADO: S1], Bambu 0–60 % [VERIFICADO: S3]. Elegido 15–35 % + 60 % en puentes [ESTIMADO].
cooling = 1
fan_always_on = 1
min_fan_speed = 15
max_fan_speed = 35
bridge_fan_speed = 60
disable_fan_first_layers = 3
full_fan_speed_layer = 0
fan_below_layer_time = 30
slowdown_below_layer_time = 15
min_print_speed = 10
# Caudal máximo [ESTIMADO: hotend de serie de la S1 con PETG ~8 mm³/s; con 0,45 × 0,20 mm = 89 mm/s].
filament_max_volumetric_speed = 8
# Retracción para extrusor directo: 1–3 mm a 20–40 mm/s [VERIFICADO: S2]; se usa el mínimo del rango.
filament_retract_length = 1
filament_retract_speed = 30
filament_deretract_speed = 0
filament_retract_lift = 0.2
filament_retract_before_travel = 2
filament_retract_layer_change = 1
filament_wipe = 1
filament_colour = #D8D8D8
filament_notes = P1 PETG: secar 65 C x 6-8 h (TDS PolyLite/Bambu); caja con desecante HR<20 %; cama PC + pegamento en barra; color claro al sol (research/R05 A4); HDT(1,8 MPa) >= 70 C.
start_filament_gcode = "; Filament gcode\n"
end_filament_gcode = "; Filament-specific end gcode\n"
