l" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Agujero Ø12,5 pasante (tornillo ISO 4017 M12 × 60 A4-80); ×2</text><text font-size="10" x="20" y="525">• Montaje: Tef-Gel en piloto, cara de la brida y rosca; arandela ISO 7089 M12 bajo la cabeza,</text><text font-size="10" x="20" y="540">•   espaciador, oreja, arandela y tuerca DIN 985 M12 A4 por dentro</text><text font-size="10" x="20" y="555">• Par 45 N·m → precarga 17–31 kN (K 0.12–0.22 [ESTIMADO])</text><text font-size="10" x="20" y="570">• El piloto (11.5 mm) es 0,5 más corto que la oreja: aprieta la brida, no el piloto</text><text font-size="10" x="20" y="585">• Juego axial del bucket 0,3 mm contra la arandela de la cabeza (verificar a mano: gira libre)</text></g></svg>