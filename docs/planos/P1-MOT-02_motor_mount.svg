-size="10" x="794.5306944278083" y="143">4: x=66.7  y=48.2  Ø6.4  M6 A4 a la cara del motor [ESTIMADO: medir PCD]</text><text font-family="DejaVu Sans" font-size="10" x="794.5306944278083" y="158">5: x=123.3  y=48.2  Ø6.4  M6 A4 a la cara del motor [ESTIMADO: medir PCD]</text><line stroke="#0050a0" stroke-width="0.8" x1="80" x2="754.5306944278083" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="80" x2="80" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="754.5306944278083" x2="754.5306944278083" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="417.26534721390414" y="57">190.0</text><text font-family="DejaVu Sans" font-size="10" x="40" y="340.0">146.5</text><text font-family="DejaVu Sans" font-size="11" x="80" y="625.0">Espesor 10.0 mm</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="790" /><text font-size="12" font-weight="bold" x="978" y="808">P1-MOT-02  motor_mount</text><text font-size="10" font-weight="normal" x="978" y="825">Material: Al 6082-T651 (placa + pies + cartelas soldados)</text><text font-size="10" font-weight="normal" x="978" y="842">Escala 3.55:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="859">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="876">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="790">• Placa ⟂ al eje (5°); borde inferior sobre el piso z = 75. Pies 60 × 50 × 10 hacia proa en |y| = 45–95.</text><text font-size="10" x="20" y="805">• Agujeros de los pies: 4 × Ø9 (M8 A4 a varengas/largueros a través del piso): (697, -70), (697, 70), (730, -70), (730, 70) (x, y BOTE).</text><text font-size="10" x="20" y="820">• Antes de agujerear la placa: MEDIR el patrón de agujeros y el centrador del motor recibido (MTI120116 no publica plano).</text><text font-size="10" x="20" y="835">• Sin empuje: dejar la luz 's' del Rotex (2 mm) con el motor abulonado; verificar alineación &lt; 0,2 mm / 0,5° con reloj.</text></g></svg>