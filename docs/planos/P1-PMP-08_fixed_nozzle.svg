47023" y="38.0">fin del cono: Ø87,12 cilíndrico 17,4</text><line stroke="red" stroke-width="0.8" x1="244.0958470420262" x2="244.0958470420262" y1="40.0" y2="200" /><text fill="red" font-family="DejaVu Sans" font-size="9" x="247.0958470420262" y="38.0">SALIDA Ø87,12 en X_noz1 = plano del espejo</text><line stroke="red" stroke-width="0.8" x1="260.75734061704634" x2="260.75734061704634" y1="40.0" y2="200" /><text fill="red" font-family="DejaVu Sans" font-size="9" x="263.75734061704634" y="38.0">ranura O-ring 4,73 × 2,65 prof.</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="266.4932646346763" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="266.4932646346763" x2="266.4932646346763" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="163.24663231733814" y="57">Largo total 151.2</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="510" /><text font-size="12" font-weight="bold" x="978" y="528">P1-PMP-08  fixed_nozzle</text><text font-size="10" font-weight="normal" x="978" y="545">Material: Al 6061-T6 torneado, anodizado duro</text><text font-size="10" font-weight="normal" x="978" y="562">Escala 1.37:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Interior: Ø132,79 → Ø87,12 cono (semiángulo 12,2°) de X 146,5 a 251,9; alojamiento esférico R50,94 centrado en el pivote (X 295,7) hasta X 282,7; luego Ø127,4.</text><text font-size="10" x="20" y="525">• Brida: 8 × Ø5,5 en Ø151,79 a 22.5° + k·45° — ISO 4762 M5 × 20 A4-70 + Tef-Gel, roscados en la carcasa (rosca engranada 7,75). Espiga 12,00 +0,05/0 desde la cara de la brida: luz entre bridas 0,25 ± 0,05 medida con galgas.</text><text font-size="10" x="20" y="540">• SERVICIO: brida Ø161,1 &lt; agujero del espejo Ø166,0 → sale por popa con el estator detrás (sin tocar el tren). Área de salida π/4·87,12² = 5961 mm².</text></g></svg>