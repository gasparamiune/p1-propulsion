rte</text><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="1084.375" y1="60" y2="60" /><line stroke="#0050a0" stroke-width="0.8" x1="60" x2="60" y1="56" y2="64" /><line stroke="#0050a0" stroke-width="0.8" x1="1084.375" x2="1084.375" y1="56" y2="64" /><text fill="#0050a0" font-family="DejaVu Sans" font-size="9" text-anchor="middle" x="572.1875" y="57">Largo total 74.5</text><g font-family="DejaVu Sans" font-size="11"><rect fill="none" height="100" stroke="black" width="420" x="970" y="510" /><text font-size="12" font-weight="bold" x="978" y="528">P1-REV-04  embolo_perno</text><text font-size="10" font-weight="normal" x="978" y="545">Material: AISI 316 (1.4401) barra Ø18</text><text font-size="10" font-weight="normal" x="978" y="562">Escala 13.75:1 (pantalla)  —  cotas en mm</text><text font-size="10" font-weight="normal" x="978" y="579">Tolerancias generales ISO 2768-m; aristas matadas 0.3×45°; Ra 1.6 en asientos</text><text font-size="10" font-weight="normal" x="978" y="596">P1-J waterjet — generado por 04_diseno/planos.py desde inputs.yaml</text><text font-size="10" x="20" y="510">• Largo del Ø16: guía 18 + luz oreja–brazo 5.5 (lóbulo y collar del cuerpo) + brazo 8 + 1 de sobresalida</text><text font-size="10" x="20" y="525">• Carrera 12 mm (liberar pide 9.5); ×2. Punta: hexágono interior 6 × 6 (se sostiene desde</text><text font-size="10" x="20" y="540">•   afuera por el agujero del brazo al roscar o sacar el pomo; MECH-7). Control en banco con el pomo apoyado en la tapa: la punta</text><text font-size="10" x="20" y="555">•   queda a 10.0 ± 0,2 de la cara exterior del collar (sobresale 1 mm del brazo)</text><text font-size="10" x="20" y="570">• POMO (AISI 316, de la misma barra Ø35 del cuerpo): Ø23 × 10 con rosca ciega M10×1 × 8 y fondo de 2 mm con Ø4,5 (pasa el vástago</text><text font-size="10" x="20" y="585">•   M4 del eslabón de P1-REV-09); 2 planos e/c 22. Se rosca A FONDO en la cola con Loctite 243 (el extremo de la cola</text><text font-size="10" x="20" y="600">•   apoya en el fondo: cola 42 = cámara + tapa + rosca del pomo); se saca con llave sosteniendo el perno</text><text font-size="10" x="20" y="615">•   por el hexágono de la punta (06 §5)</text></g></svg>